<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drone Multi-Sensor Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #05070c;
    --panel: #0d1220;
    --panel-2: #10182b;
    --border: #232c40;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --active: #22c55e;
    --lost: #d99b1f;
    --closed: #6b7280;
    --drone: #ef4444;
    --aircraft: #3b82f6;
    --bird: #22c55e;
    --friendly: #14b8b0;
    --unknown: #8b93a7;
    --critical: #b91c1c;
    --high: #ef4444;
    --medium: #d99b1f;
    --low: #6b7280;
    --online: #22c55e;
    --stale: #d99b1f;
    --offline: #6b7280;
    --accent: #2563eb;
    --zone: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }

  /* --- Top bar: thin, full-width, sits above the map/panel shell. ------ */
  header.topbar {
    height: 40px;
    padding: 0 14px;
    background: #000;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 15px;
  }
  .topbar-left h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: 0.02em; color: var(--text); }
  .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--active); box-shadow: 0 0 0 rgba(34,197,94,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.55); }
    70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }
  @keyframes pulse-alert {
    0% { box-shadow: 0 0 0 2px rgba(10,14,24,0.92), 0 0 0 2px rgba(239,68,68,0.6); }
    70% { box-shadow: 0 0 0 2px rgba(10,14,24,0.92), 0 0 0 7px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 2px rgba(10,14,24,0.92), 0 0 0 2px rgba(239,68,68,0); }
  }
  #status-line { color: var(--muted); font-size: 11px; }

  /* --- App shell: icon rail + floating panels over a full-bleed map. --- */
  #app-shell { position: relative; height: calc(100vh - 40px); overflow: hidden; }
  #map { position: absolute; inset: 0; background: #05070a; z-index: 0; }

  #icon-rail {
    position: absolute; z-index: 20; top: 12px; left: 12px; bottom: 12px;
    width: 42px;
    background: rgba(10,14,24,0.92);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 4px;
    backdrop-filter: blur(6px);
  }
  .rail-btn {
    position: relative;
    width: 30px; height: 30px;
    background: transparent; border: 1px solid transparent; border-radius: 7px;
    color: var(--muted); font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .rail-btn:hover { color: var(--text); background: var(--panel-2); }
  .rail-btn.active { color: #fff; background: var(--accent); }
  .rail-btn .rail-badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--high); color: #fff; font-size: 9px; font-weight: 700;
    border-radius: 999px; padding: 1px 4px; min-width: 13px; line-height: 1.4; text-align: center;
    box-shadow: 0 0 0 2px rgba(10,14,24,0.92);
    display: none;
  }
  .rail-btn .rail-badge.show { display: block; animation: pulse-alert 2s infinite; }

  .floating-panel {
    position: absolute; z-index: 15; top: 12px; bottom: 12px;
    width: 340px;
    background: rgba(10,14,24,0.96);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #left-panel { left: 64px; transition: transform 0.15s ease; }
  #left-panel.collapsed { transform: translateX(-120%); }
  /* Unlike #left-panel (which always has a long, scrollable list and
     benefits from claiming the full viewport height), a single track's
     details are a fixed, usually-short amount of content -- pinning this
     panel to the viewport bottom the same way left a large dead gap below
     "Track quality" for a track with no motion/playback data yet. Sizing
     to content (capped so a track WITH playback data still scrolls
     instead of overflowing the viewport) reads as a real panel instead of
     a container with empty space at the bottom. */
  #details-panel { right: 12px; width: 360px; bottom: auto; max-height: calc(100vh - 24px); }

  .panel-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-header h2 { font-size: 13px; margin: 0; font-weight: 600; flex: 1; }
  .icon-btn {
    background: transparent; border: none; color: var(--muted);
    font-size: 15px; cursor: pointer; padding: 2px 4px; border-radius: 4px; line-height: 1;
  }
  .icon-btn:hover { color: var(--text); background: var(--panel-2); }

  #left-panel-search { padding: 10px 14px 0 14px; }
  #search-input {
    width: 100%;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font-size: 12px;
  }
  #search-input:focus { outline: none; border-color: var(--accent); }
  #class-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .filter-chip {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 3px 10px; font-size: 11px; cursor: pointer; user-select: none;
  }
  .filter-chip:hover { color: var(--text); border-color: #3a4763; }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-chip:focus-visible, .track-card:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  #left-panel-body { flex: 1; overflow-y: auto; padding: 10px 10px 14px 10px; }
  .panel-view { display: none; }
  .panel-view.visible { display: block; }

  .group-header {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 10px 6px 6px 6px; display: flex; align-items: center; justify-content: space-between;
  }
  .group-header .n { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); }

  .track-card {
    display: flex; gap: 10px; align-items: center;
    padding: 8px 8px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
  }
  .track-card:hover { background: var(--panel-2); }
  .track-card.selected { background: #16233c; box-shadow: inset 3px 0 0 var(--accent); }
  .track-thumb {
    width: 44px; height: 44px; border-radius: 6px; flex-shrink: 0;
    background: var(--panel-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; overflow: hidden;
  }
  .track-thumb svg { width: 22px; height: 22px; }
  .track-card-body { flex: 1; min-width: 0; }
  .track-card-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-card-sub { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .track-card-meta { font-size: 10px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #16233c; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    color: #05070a;
  }
  .badge-outline {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 9px; border-radius: 10px; font-size: 11px; font-weight: 600;
    border: 1px solid currentColor;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  #map-legend {
    position: absolute; z-index: 10; bottom: 12px; left: 64px;
    background: rgba(10,14,24,0.92); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 11px; color: var(--muted); backdrop-filter: blur(4px);
  }
  #map-legend .item { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #map-layer-toggles {
    position: absolute; z-index: 10; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(10,14,24,0.92); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; font-size: 11px; color: var(--muted); backdrop-filter: blur(4px);
    display: flex; gap: 14px;
  }
  #map-layer-toggles label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
  .leaflet-container { font-family: inherit; background: #05070a; }
  .leaflet-control-layers {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
  }
  .leaflet-control-layers-toggle { filter: invert(1) hue-rotate(180deg); }
  .leaflet-control-layers-separator { border-color: var(--border); }
  .track-tooltip {
    background: rgba(10,14,24,0.92) !important; border: 1px solid var(--border) !important;
    color: var(--text) !important; font-size: 11px !important; padding: 4px 8px !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important;
  }
  .track-tooltip::before { display: none !important; }
  .empty { color: var(--muted); font-style: italic; padding: 10px 6px; }
  .empty-ok { color: var(--muted); padding: 14px 6px; display: flex; align-items: center; gap: 8px; }
  .empty-ok .check { color: var(--active); font-size: 16px; }
  .empty-guidance { padding: 16px 14px; color: var(--muted); }
  .empty-guidance .empty-title { color: var(--text); font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .empty-guidance .empty-body { font-size: 12px; line-height: 1.5; }
  .empty-guidance .empty-checklist { margin: 10px 0 0; padding-left: 18px; font-size: 12px; line-height: 1.7; }
  .empty-guidance code {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px;
    padding: 1px 4px; font-size: 11px;
  }
  .empty-guidance button { margin-top: 10px; }
  .alert-item {
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .alert-item.sev-critical { border-left-color: var(--critical); }
  .alert-item.sev-high { border-left-color: var(--high); }
  .alert-item.sev-medium { border-left-color: var(--medium); }
  .alert-item.sev-low { border-left-color: var(--low); }
  .alert-item .top-row { display: flex; justify-content: space-between; align-items: center; }
  .alert-item .desc { color: var(--muted); margin: 6px 0; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 5px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: var(--border); color: var(--muted); cursor: default; }
  button.secondary { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
  button.secondary:hover { background: #24314a; }
  button.secondary.active { background: var(--accent); border-color: var(--accent); }

  #view-zones .panel-toolbar { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .zone-item { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .zone-item .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .zone-item .name { font-weight: 600; }
  .zone-item .name.inactive { color: var(--muted); text-decoration: line-through; }
  .zone-item .actions { display: flex; gap: 6px; margin-top: 6px; }
  #zone-draw-hint {
    padding: 8px 14px; background: var(--panel-2); color: var(--text);
    font-size: 12px; border-bottom: 1px solid var(--border);
  }
  #zone-form { padding: 14px; border-bottom: 1px solid var(--border); }
  #zone-form label { display: block; font-size: 11px; color: var(--muted); margin: 8px 0 3px; }
  #zone-form input, #zone-form select {
    width: 100%; background: #0b0f19; border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 5px 8px; font-size: 13px; box-sizing: border-box;
  }
  #zone-form .row { display: flex; gap: 8px; }
  #zone-form .row > div { flex: 1; }
  #zone-form .actions { display: flex; gap: 6px; margin-top: 10px; }
  #zone-form .actions button { flex: 1; }
  #zone-form-error { color: var(--high); font-size: 12px; margin-top: 6px; }

  #details-panel .panel-body { flex: 1; overflow-y: auto; padding: 14px; }
  .status-pill {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--active); margin-bottom: 2px; display: block;
  }
  .detail-title-row { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .detail-actions { display: flex; gap: 6px; padding: 0 14px 12px 14px; border-bottom: 1px solid var(--border); }
  .detail-actions button { flex: 1; }
  .kv-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 8px; align-content: start; }
  .kv .k { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .kv .v { font-size: 13px; }
  .kv-section { padding: 14px 14px 0 14px; }
  .kv-section + .kv-section { margin-top: 0; padding-top: 14px; border-top: 1px solid var(--border); }
  .kv-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 8px 0;
  }
  .meter { background: var(--panel-2); border-radius: 999px; height: 6px; overflow: hidden; margin-top: 4px; }
  .meter-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
  .sparkline-wrap { margin-top: 4px; }
  .heading-arrow { display: inline-block; font-size: 14px; }
  .playback-row { display: flex; align-items: center; gap: 8px; }
  .playback-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .playback-time { font-size: 11px; color: var(--muted); min-width: 74px; text-align: right; white-space: nowrap; }

  /* --- Narrow viewport: the desktop layout's two side-by-side floating
     panels (each 340-360px) plus the icon rail don't fit next to each
     other below ~900px -- #details-panel's fixed right-anchored width
     left its left edge overlapping the rail (which sits on top, z-index-
     wise, silently clipping the panel's own back button under it) well
     before that, too. Below 760px both panels go full-width (anchored
     past the rail, which stays reachable) and stack instead of
     overlapping: only one is ever visible at a time, and the rail's
     already-active-icon-click (below) collapses the tracks/alerts/
     sensors panel entirely so the map itself is reachable, not just
     visible in the gaps around a panel that otherwise never closes. --- */
  @media (max-width: 760px) {
    #left-panel, #details-panel { left: 60px; right: 12px; width: auto; }
    body.details-open #left-panel { display: none; }
    #map-legend { display: none; }
    #map-layer-toggles {
      left: 60px; right: 12px; transform: none;
      justify-content: space-around; font-size: 10px;
    }
    header.topbar .topbar-left h1 { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="brand-mark" aria-hidden="true">&#9670;</span>
    <h1>Drone Multi-Sensor</h1>
    <span class="live-dot" aria-hidden="true"></span>
    <div id="status-line">loading…</div>
  </div>
</header>

<div id="auth-bar" style="display:none; padding:10px 20px; background:#2a1620; border-bottom:1px solid var(--border); gap:8px; align-items:center;">
  <span style="color:var(--drone);">API key required or rejected.</span>
  <input id="auth-input" type="password" placeholder="X-API-Key" aria-label="API key" style="background:#0b0f19; border:1px solid var(--border); color:var(--text); border-radius:4px; padding:4px 8px;">
  <button id="auth-save">Save key</button>
</div>

<div id="app-shell">
  <div id="map"></div>

  <div id="map-layer-toggles">
    <label><input type="checkbox" id="toggle-trail" checked> Trails</label>
    <label><input type="checkbox" id="toggle-vectors" checked> Vectors</label>
    <label><input type="checkbox" id="toggle-uncertainty" checked> Uncertainty</label>
  </div>

  <nav id="icon-rail" aria-label="Panel selector">
    <button class="rail-btn active" data-panel="tracks" title="Tracks" aria-label="Tracks" aria-pressed="true">
      &#9635;
    </button>
    <button class="rail-btn" data-panel="alerts" title="Alerts" aria-label="Alerts" aria-pressed="false">
      &#9650;<span class="rail-badge" id="alerts-badge" aria-hidden="true"></span>
    </button>
    <button class="rail-btn" data-panel="sensors" title="Sensor health" aria-label="Sensor health" aria-pressed="false">
      &#9738;
    </button>
    <button class="rail-btn" data-panel="zones" title="Zones" aria-label="Zones" aria-pressed="false">
      &#11040;
    </button>
  </nav>

  <aside class="floating-panel" id="left-panel">
    <div class="panel-header">
      <h2 id="left-panel-title">Tracks <span class="count" id="tracks-count" style="font-weight:400;color:var(--muted);"></span></h2>
    </div>

    <div id="left-panel-search">
      <input id="search-input" type="text" placeholder="Search ID or UID…">
      <div id="class-filters"></div>
    </div>

    <div id="left-panel-body">
      <div class="panel-view visible" id="view-tracks"><div id="tracks-list"></div></div>
      <div class="panel-view" id="view-alerts">
        <div class="group-header" style="color:var(--text);">Active alerts <span class="n" id="alerts-count"></span></div>
        <div id="alerts-list"></div>
      </div>
      <div class="panel-view" id="view-sensors">
        <div class="group-header" style="color:var(--text);">Sensor health</div>
        <div id="sensors-table"></div>
      </div>
      <div class="panel-view" id="view-zones">
        <div class="panel-toolbar">
          <button id="zone-new-btn">+ New zone</button>
        </div>
        <div id="zone-draw-hint" style="display:none;"></div>
        <div id="zone-form" style="display:none;"></div>
        <div id="zones-list"></div>
      </div>
    </div>
  </aside>

  <aside class="floating-panel" id="details-panel" style="display:none;">
    <div class="panel-header">
      <button class="icon-btn" id="details-back" title="Back" aria-label="Back to list">&#8592;</button>
      <h2>Track details</h2>
      <button class="icon-btn" id="details-close" title="Close" aria-label="Close track details">&times;</button>
    </div>
    <div class="panel-body" id="track-details"></div>
  </aside>

  <div id="map-legend">
    <div class="item"><span class="dot" style="background:var(--drone)"></span>Drone</div>
    <div class="item"><span class="dot" style="background:var(--aircraft)"></span>Aircraft</div>
    <div class="item"><span class="dot" style="background:var(--bird)"></span>Bird</div>
    <div class="item"><span class="dot" style="background:var(--friendly)"></span>Friendly</div>
    <div class="item"><span class="dot" style="background:var(--unknown)"></span>Unknown</div>
    <div class="item"><span class="dot" style="background:var(--zone); opacity:0.6;"></span>Restricted zone</div>
    <!-- 30s matches VECTOR_HORIZON_S below; this is static markup (not
         a template literal), so it can't interpolate the JS constant. -->
    <div class="item"><span style="display:inline-block;width:14px;height:0;border-top:2px dotted var(--muted);"></span>Projected path (30s)</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// A fallback safety net, not the primary update path -- see
// connectLiveSocket() below, which pushes an update within milliseconds
// of a new detection/incident instead of waiting up to this long. Kept
// long (not eliminated) because a WebSocket push only reaches the one
// replica a client happens to be connected to behind a load balancer
// (see app/live.py's docstring) -- polling is what catches anything a
// different replica processed.
const POLL_MS = 15000;

const state = {
  tracks: [], incidents: [], zones: [], sensors: [], allZones: [],
  selectedTrackId: null, trail: [], classFilter: "all", search: "",
  follow: false, showTrail: true, showUncertainty: true, showVectors: true,
  activePanel: "tracks",
  // null == showing each track's live position; otherwise an index into
  // `trail` (the selected track's full history, oldest first) being
  // scrubbed to via the Playback slider in the details panel.
  scrubIndex: null,
  // Non-null while creating/editing a zone by clicking points on the map
  // (see startZoneDraw() below) -- {points, editingZoneId, original}.
  zoneDraft: null,
};
let apiKey = localStorage.getItem("droneApiKey") || "";

// Recent on-map positions per track, captured from each poll (not fetched
// history) so every visible track can show a short fading trail without a
// per-track history request every 3s -- only the *selected* track gets its
// full server-side history (state.trail, fetched once on selection).
const breadcrumbs = new Map();
const BREADCRUMB_MAX_POINTS = 12;
const BREADCRUMB_MAX_AGE_MS = 10 * 60 * 1000;
let playbackTimer = null;
const PLAYBACK_INTERVAL_MS = 300;
// Fixed visual projection horizon for the map's speed-vector line -- matches
// PREDICTIVE_HORIZON_SECONDS' documented default (app/config.py), but this
// is a client-side visual aid, not read from live server config, so it
// won't track a deployment that overrides that env var.
const VECTOR_HORIZON_S = 30;
// Mirrors app/incidents.py's _MIN_SPEED_FOR_PROJECTION_MPS: near-zero speed
// makes a Kalman-filtered heading too noisy to draw a meaningful vector.
const MIN_VECTOR_SPEED_MPS = 1.0;

// Spherical-earth forward geodesic, ported from app/geo.py's
// destination_point so the drawn speed vector matches the same math the
// backend uses for predictive-incursion projection, not a flat lat/lon-
// degree approximation that distorts increasingly at higher latitudes.
function destinationPoint(lat, lon, bearingDeg, distanceM) {
  const R = 6371000.0;
  const angularDistance = distanceM / R;
  const bearingRad = (bearingDeg * Math.PI) / 180;
  const lat1Rad = (lat * Math.PI) / 180;
  const lat2Rad = Math.asin(
    Math.sin(lat1Rad) * Math.cos(angularDistance) +
      Math.cos(lat1Rad) * Math.sin(angularDistance) * Math.cos(bearingRad)
  );
  const lon2Rad =
    (lon * Math.PI) / 180 +
    Math.atan2(
      Math.sin(bearingRad) * Math.sin(angularDistance) * Math.cos(lat1Rad),
      Math.cos(angularDistance) - Math.sin(lat1Rad) * Math.sin(lat2Rad)
    );
  return [(lat2Rad * 180) / Math.PI, (lon2Rad * 180) / Math.PI];
}

const CLASS_COLOR = {
  drone: "var(--drone)", aircraft: "var(--aircraft)", bird: "var(--bird)",
  friendly: "var(--friendly)", unknown: "var(--unknown)",
};
// Leaflet needs real hex/rgb values in inline SVG -- CSS custom properties
// don't resolve inside a divIcon's raw HTML string.
const CLASS_COLOR_HEX = {
  drone: "#ef4444", aircraft: "#3b82f6", bird: "#22c55e",
  friendly: "#14b8b0", unknown: "#8b93a7",
};
const STATUS_COLOR = { active: "var(--active)", lost: "var(--lost)", closed: "var(--closed)" };
const SEVERITY_COLOR = { critical: "var(--critical)", high: "var(--high)", medium: "var(--medium)", low: "var(--low)" };
const SENSOR_STATUS_COLOR = { online: "var(--online)", stale: "var(--stale)", offline: "var(--offline)" };
const CLASS_LABELS = ["all", "drone", "aircraft", "bird", "friendly", "unknown"];
// Display grouping, closest read to "disposition" groups (Friendly / Hostile-
// ish / Unknown) without inventing a military disposition vocabulary this
// app doesn't otherwise use -- app/models.py's Classification is what's real.
const GROUP_ORDER = ["friendly", "drone", "aircraft", "bird", "unknown"];
const GROUP_LABEL = {
  friendly: "Friendly", drone: "Drone", aircraft: "Aircraft", bird: "Bird", unknown: "Unknown",
};

class AuthError extends Error {}

async function fetchJSON(url, opts) {
  const headers = { ...(opts && opts.headers), ...(apiKey ? { "X-API-Key": apiKey } : {}) };
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401) throw new AuthError(`${url} -> 401`);
  if (!res.ok) throw new Error(`${url} -> ${res.status}`);
  return res.json();
}

function showAuthBar(show) {
  document.getElementById("auth-bar").style.display = show ? "flex" : "none";
}

function fmtTime(iso) {
  if (!iso) return "—";
  return new Date(iso + (iso.endsWith("Z") ? "" : "Z")).toLocaleTimeString();
}

// Relative "13s ago" / "5m ago" style formatting -- easier to scan at a
// glance than an absolute clock time, especially for "is this feed still
// alive" questions.
function fmtRelative(iso) {
  if (!iso) return "—";
  const then = new Date(iso + (iso.endsWith("Z") ? "" : "Z")).getTime();
  const diffS = Math.max(0, Math.round((Date.now() - then) / 1000));
  if (diffS < 5) return "just now";
  if (diffS < 60) return `${diffS}s ago`;
  const diffM = Math.round(diffS / 60);
  if (diffM < 60) return `${diffM}m ago`;
  const diffH = Math.round(diffM / 60);
  if (diffH < 24) return `${diffH}h ago`;
  return `${Math.round(diffH / 24)}d ago`;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function badge(text, color) {
  return `<span class="badge" style="background:${color}">${escapeHtml(text)}</span>`;
}

function badgeOutline(text, color) {
  return `<span class="badge-outline" style="color:${color}">${escapeHtml(text)}</span>`;
}

function headingArrow(headingDeg) {
  if (headingDeg == null) return "";
  return `<span class="heading-arrow" style="display:inline-block;transform:rotate(${headingDeg}deg)">&#8593;</span>`;
}

function visibleTracks() {
  const search = state.search.trim().toLowerCase();
  return state.tracks.filter((t) => {
    if (state.classFilter !== "all" && t.classification !== state.classFilter) return false;
    if (!search) return true;
    return String(t.id).includes(search) || t.track_uid.toLowerCase().includes(search);
  });
}

// --- Left-rail panel switching: Tracks / Alerts / Sensors share one
// floating panel, one view visible at a time -- mirrors a multi-purpose
// side rail instead of three permanently-stacked panels competing for
// screen space now that the map is full-bleed behind them. -------------
function showPanel(name) {
  // Leaving the zones panel mid-draw would otherwise strand the map's
  // click-to-add-vertex listener and crosshair cursor active underneath
  // whatever panel is shown next.
  if (name !== "zones" && state.zoneDraft) cancelZoneDraw();
  document.getElementById("left-panel").classList.remove("collapsed");
  state.activePanel = name;
  document.querySelectorAll(".rail-btn").forEach((btn) => {
    const isActive = btn.dataset.panel === name;
    btn.classList.toggle("active", isActive);
    btn.setAttribute("aria-pressed", String(isActive));
  });
  document.querySelectorAll(".panel-view").forEach((view) => {
    view.classList.toggle("visible", view.id === `view-${name}`);
  });
  document.getElementById("left-panel-search").style.display = name === "tracks" ? "block" : "none";
  const titles = { tracks: "Tracks", alerts: "Alerts", sensors: "Sensor health", zones: "Zones" };
  document.getElementById("left-panel-title").firstChild.textContent = titles[name] + " ";
  document.getElementById("tracks-count").style.display = name === "tracks" ? "inline" : "none";
}

// Clicking the already-active rail icon collapses its panel instead of
// re-showing an already-visible one -- on a narrow viewport (see the
// max-width: 760px block above) the left panel otherwise never closes,
// leaving no way to actually see the map underneath it.
function toggleOrShowPanel(name) {
  const leftPanel = document.getElementById("left-panel");
  if (state.activePanel === name && !leftPanel.classList.contains("collapsed")) {
    leftPanel.classList.add("collapsed");
    return;
  }
  showPanel(name);
}

function showDetailsPanel(show) {
  document.getElementById("details-panel").style.display = show ? "flex" : "none";
  document.body.classList.toggle("details-open", show);
}

async function selectTrack(id) {
  state.selectedTrackId = id;
  state.trail = [];
  state.scrubIndex = null;
  stopPlayback();
  showDetailsPanel(true);
  renderTracks();
  renderMap();
  renderDetails();
  flyToTrack(id, { animate: true });

  try {
    const history = await fetchJSON(`/api/tracks/${id}/history?limit=2000`);
    if (state.selectedTrackId !== id) return; // a newer selection has since won
    state.trail = history
      .filter((d) => d.latitude != null && d.longitude != null)
      .map((d) => ({ lat: d.latitude, lon: d.longitude, t: d.timestamp }));
    renderMap();
    renderDetails();
  } catch (e) {
    if (e instanceof AuthError) showAuthBar(true);
    console.error(e);
  }
}

function deselectTrack() {
  state.selectedTrackId = null;
  state.trail = [];
  state.scrubIndex = null;
  stopPlayback();
  showDetailsPanel(false);
  renderTracks();
  renderMap();
}

// --- Timeline scrubber: replay the selected track's full history
// (state.trail, oldest first) instead of only ever showing its live
// position. ------------------------------------------------------------

function stopPlayback() {
  if (playbackTimer != null) {
    clearInterval(playbackTimer);
    playbackTimer = null;
  }
}

function updatePlaybackUI() {
  const range = document.getElementById("scrub-range");
  const timeLabel = document.getElementById("scrub-time");
  const playBtn = document.getElementById("play-btn");
  const liveBtn = document.getElementById("live-btn");
  if (range) range.value = String(state.scrubIndex ?? state.trail.length - 1);
  if (timeLabel) {
    timeLabel.textContent = state.scrubIndex != null ? fmtTime(state.trail[state.scrubIndex].t) : "Live";
  }
  if (playBtn) playBtn.textContent = playbackTimer != null ? "Pause" : "Play";
  if (liveBtn) liveBtn.disabled = state.scrubIndex == null;
}

function setScrubIndex(index) {
  stopPlayback();
  state.scrubIndex = index;
  renderMap();
  updatePlaybackUI();
}

function goLive() {
  stopPlayback();
  state.scrubIndex = null;
  renderMap();
  updatePlaybackUI();
}

function togglePlayback() {
  if (playbackTimer != null) {
    stopPlayback();
    updatePlaybackUI();
    return;
  }
  if (state.trail.length < 2) return;
  if (state.scrubIndex == null || state.scrubIndex >= state.trail.length - 1) {
    state.scrubIndex = 0;
  }
  playbackTimer = setInterval(() => {
    state.scrubIndex = (state.scrubIndex ?? -1) + 1;
    if (state.scrubIndex >= state.trail.length - 1) {
      state.scrubIndex = state.trail.length - 1;
      stopPlayback();
    }
    renderMap();
    updatePlaybackUI();
  }, PLAYBACK_INTERVAL_MS);
  updatePlaybackUI();
}

function flyToTrack(id, opts) {
  const track = state.tracks.find((t) => t.id === id);
  if (!track || track.latitude == null || !leafletMap) return;
  // 15, not 13: a typical position_uncertainty_m ring (tens of meters) is
  // only a handful of pixels wide at zoom 13 -- easy to mistake for "not
  // drawn at all" when it's actually just smaller than the marker sitting
  // on top of it. 15 gives it enough screen size to read as a ring.
  const zoom = Math.max(leafletMap.getZoom(), 15);
  if (opts && opts.animate) {
    leafletMap.flyTo([track.latitude, track.longitude], zoom, { duration: 0.6 });
  } else {
    leafletMap.panTo([track.latitude, track.longitude], { animate: true, duration: 0.4 });
  }
}

async function acknowledge(id) {
  try {
    await fetchJSON(`/api/incidents/${id}/acknowledge`, { method: "POST" });
    await refresh();
  } catch (e) {
    if (e instanceof AuthError) showAuthBar(true);
    console.error(e);
  }
}

// Posts a short sequence of detections forming one moving track, via the
// same public /api/detections path any real sensor uses -- lets the
// empty-state "Simulate tracks" button show what the dashboard actually
// looks like with live data, without needing app/simulator.py running
// separately. Positioned well outside app/zones.seed.json's bundled
// restricted zone so clicking it doesn't also surprise a first-time
// viewer with an unrelated incident.
async function simulateDemoTracks() {
  const btn = document.getElementById("simulate-tracks-btn");
  if (btn) {
    btn.disabled = true;
    btn.textContent = "Simulating…";
  }
  try {
    const base = { sensor_id: "demo-radar-1", sensor_type: "radar", confidence: 0.9 };
    let lat = 51.45;
    let lon = -0.2;
    for (let i = 0; i < 6; i++) {
      lat += 0.0015;
      lon += 0.0012;
      await fetchJSON("/api/detections", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...base, latitude: lat, longitude: lon }),
      });
      await new Promise((resolve) => setTimeout(resolve, 150));
    }
    await refresh();
  } catch (e) {
    if (e instanceof AuthError) {
      showAuthBar(true);
    } else {
      console.error(e);
    }
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = "Simulate tracks";
    }
  }
}

// A <span>/<div> with a click handler is invisible to keyboard-only and
// screen-reader users -- not just unlabeled, entirely unreachable (no
// tab stop, no Enter/Space activation). role="button" + tabindex="0" +
// a keydown handler is the standard fix for a custom, non-<button>
// clickable element (not converted to a real <button> here because the
// global `button { ... }` rule declared later in this stylesheet would
// win the cascade over .filter-chip/.track-card's own styling at equal
// specificity, repainting them as solid-blue action buttons).
function makeKeyboardActivatable(el, activate) {
  el.setAttribute("role", "button");
  el.setAttribute("tabindex", "0");
  el.addEventListener("click", activate);
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      activate();
    }
  });
}

function renderClassFilters() {
  const el = document.getElementById("class-filters");
  el.innerHTML = CLASS_LABELS.map((c) => {
    const activeClass = state.classFilter === c ? "active" : "";
    const label = c === "all" ? "All" : c.charAt(0).toUpperCase() + c.slice(1);
    return `<span class="filter-chip ${activeClass}" data-class="${c}" aria-pressed="${state.classFilter === c}">${label}</span>`;
  }).join("");
  el.querySelectorAll(".filter-chip").forEach((chip) => {
    makeKeyboardActivatable(chip, () => {
      state.classFilter = chip.dataset.class;
      renderClassFilters();
      renderTracks();
      renderMap();
    });
  });
}

// A small icon standing in for each classification, shown in the track
// card's thumbnail slot -- a real camera-derived thumbnail isn't something
// every sensor type can produce (radar/RF/acoustic detections have no
// image at all), so this is a consistent glyph-per-class instead of a mix
// of real photos and blank boxes.
function classIcon(classification) {
  const color = CLASS_COLOR_HEX[classification] || CLASS_COLOR_HEX.unknown;
  if (classification === "aircraft") {
    return `<svg viewBox="0 0 24 24" fill="${color}"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2.5 2v1.5L12 21l4.5 1.5V21L14 19v-5.5z"/></svg>`;
  }
  if (classification === "bird") {
    return `<svg viewBox="0 0 24 24" fill="${color}"><path d="M2 12s3-6 10-6c2 0 3.5.6 4.5 1.3.8-.9 2-1.3 3.5-1.3-1 1.5-1.2 2.6-1.2 3.5 0 4-3 8-9 8-2.5 0-4.5-.6-6-1.6L2 17l1.2-4.2C2.4 12.5 2 12 2 12z"/></svg>`;
  }
  if (classification === "friendly") {
    return `<svg viewBox="0 0 24 24" fill="${color}"><path d="M12 2l7 3v6c0 5-3.5 8.5-7 11-3.5-2.5-7-6-7-11V5z"/></svg>`;
  }
  // drone + unknown share the quadcopter glyph -- unknown is "unclassified
  // aerial contact", still visually a drone-shaped thing on the map.
  return `<svg viewBox="0 0 24 24" fill="${color}"><circle cx="5" cy="5" r="2.4"/><circle cx="19" cy="5" r="2.4"/><circle cx="5" cy="19" r="2.4"/><circle cx="19" cy="19" r="2.4"/><rect x="10.5" y="10.5" width="3" height="3" rx="0.5"/><line x1="5" y1="5" x2="10.5" y2="10.5" stroke="${color}" stroke-width="1.4"/><line x1="19" y1="5" x2="13.5" y2="10.5" stroke="${color}" stroke-width="1.4"/><line x1="5" y1="19" x2="10.5" y2="13.5" stroke="${color}" stroke-width="1.4"/><line x1="19" y1="19" x2="13.5" y2="13.5" stroke="${color}" stroke-width="1.4"/></svg>`;
}

function renderTracks() {
  const el = document.getElementById("tracks-list");
  const tracks = visibleTracks();
  document.getElementById("tracks-count").textContent = `${tracks.length}/${state.tracks.length}`;
  if (tracks.length === 0) {
    // Two different empty states: nothing has ever come in yet (a fresh
    // deployment or a demo with no sensor/simulator running), vs. real
    // tracks exist but the current search/filter excludes all of them --
    // "no tracks match your filter" would be actively misleading for the
    // first case, and "waiting for sensor data" would be misleading for
    // the second.
    if (state.tracks.length === 0) {
      el.innerHTML = `<div class="empty-guidance">
        <div class="empty-title">No tracks detected</div>
        <div class="empty-body">Waiting for sensor data — a track appears here automatically once a detection is posted to <code>/api/detections</code>.</div>
        <button id="simulate-tracks-btn">Simulate tracks</button>
      </div>`;
      document.getElementById("simulate-tracks-btn").addEventListener("click", simulateDemoTracks);
    } else {
      el.innerHTML = '<div class="empty">No tracks match your search/filter.</div>';
    }
    return;
  }

  const byGroup = new Map(GROUP_ORDER.map((g) => [g, []]));
  tracks.forEach((t) => {
    if (!byGroup.has(t.classification)) byGroup.set(t.classification, []);
    byGroup.get(t.classification).push(t);
  });

  el.innerHTML = GROUP_ORDER.filter((g) => byGroup.get(g) && byGroup.get(g).length > 0)
    .map((g) => {
      const groupTracks = byGroup.get(g).slice().sort((a, b) => (a.last_seen < b.last_seen ? 1 : -1));
      const cards = groupTracks
        .map((t) => {
          const sel = t.id === state.selectedTrackId ? "selected" : "";
          const pos = t.latitude != null ? `${t.latitude.toFixed(4)}, ${t.longitude.toFixed(4)}` : "no position";
          const speed = t.speed_mps != null ? `${t.speed_mps.toFixed(1)} m/s` : null;
          return `<div class="track-card ${sel}" data-id="${t.id}" aria-pressed="${t.id === state.selectedTrackId}">
            <div class="track-thumb" aria-hidden="true">${classIcon(t.classification)}</div>
            <div class="track-card-body">
              <div class="track-card-title">Track ${t.id} &middot; ${escapeHtml(t.track_uid.slice(0, 8))}</div>
              <div class="track-card-sub">
                <span class="status-dot" style="background:${STATUS_COLOR[t.status] || STATUS_COLOR.closed}"></span>
                ${escapeHtml(t.status)} ${speed ? "&middot; " + speed : ""}
              </div>
              <div class="track-card-meta">${pos} &middot; ${fmtRelative(t.last_seen)}</div>
            </div>
          </div>`;
        })
        .join("");
      return `<div class="group-header" style="color:${CLASS_COLOR[g] || CLASS_COLOR.unknown}">
          ${GROUP_LABEL[g] || g} <span class="n">${groupTracks.length}</span>
        </div>${cards}`;
    })
    .join("");

  el.querySelectorAll(".track-card").forEach((card) => {
    makeKeyboardActivatable(card, () => selectTrack(Number(card.dataset.id)));
  });
}

function renderAlerts() {
  const el = document.getElementById("alerts-list");
  const active = state.incidents.filter((i) => i.status !== "resolved");
  document.getElementById("alerts-count").textContent = active.length ? String(active.length) : "";
  const badgeEl = document.getElementById("alerts-badge");
  const alertsRailBtn = document.querySelector('.rail-btn[data-panel="alerts"]');
  if (active.length > 0) {
    badgeEl.textContent = active.length > 99 ? "99+" : String(active.length);
    badgeEl.classList.add("show");
    // The badge itself is aria-hidden (a purely visual count) -- the
    // number belongs in the button's own accessible name instead, the
    // same information a sighted user gets from the badge at a glance.
    alertsRailBtn.setAttribute("aria-label", `Alerts, ${active.length} active`);
  } else {
    badgeEl.classList.remove("show");
    alertsRailBtn.setAttribute("aria-label", "Alerts");
  }
  if (active.length === 0) {
    el.innerHTML = '<div class="empty-ok"><span class="check">&#10003;</span> No active alerts — all systems nominal.</div>';
    return;
  }
  const zoneName = (id) => state.zones.find((z) => z.id === id)?.name ?? `zone ${id}`;
  el.innerHTML = active
    .slice()
    .sort((a, b) => (a.opened_at < b.opened_at ? 1 : -1))
    .map((i) => `
      <div class="alert-item sev-${i.severity}">
        <div class="top-row">
          ${badge(i.severity, SEVERITY_COLOR[i.severity] || SEVERITY_COLOR.low)}
          ${badgeOutline(i.status, i.status === "open" ? "var(--drone)" : "var(--lost)")}
        </div>
        <div class="desc">${escapeHtml(i.description || i.incident_type)}${i.zone_id ? " · " + escapeHtml(zoneName(i.zone_id)) : ""}</div>
        <div style="color:var(--muted); font-size:12px;">track ${i.track_id ?? "—"} · opened ${fmtRelative(i.opened_at)}</div>
        ${i.status === "open" ? `<div style="margin-top:6px;"><button data-id="${i.id}">Acknowledge</button></div>` : ""}
      </div>
    `)
    .join("");
  el.querySelectorAll("button[data-id]").forEach((btn) => {
    btn.addEventListener("click", () => acknowledge(Number(btn.dataset.id)));
  });
}

// A small inline SVG sparkline of the selected track's trail -- lat/lon
// normalized into a fixed viewBox, not a geographically accurate map, just
// a quick "what shape has this flight taken" preview inside the details
// panel without needing a second full map widget.
function trailSparkline(trail) {
  if (trail.length < 2) return "";
  const lats = trail.map((p) => p.lat);
  const lons = trail.map((p) => p.lon);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const latRange = Math.max(maxLat - minLat, 1e-6);
  const lonRange = Math.max(maxLon - minLon, 1e-6);
  const w = 300, h = 60, pad = 6;
  const points = trail.map(({ lat, lon }) => {
    const x = pad + ((lon - minLon) / lonRange) * (w - 2 * pad);
    const y = h - pad - ((lat - minLat) / latRange) * (h - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const last = points[points.length - 1].split(",");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;">
    <polyline points="${points.join(" ")}" fill="none" stroke="#8b93a7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="#fff"/>
  </svg>`;
}

function renderDetails() {
  const el = document.getElementById("track-details");
  const track = state.tracks.find((t) => t.id === state.selectedTrackId);
  if (!track) {
    showDetailsPanel(false);
    return;
  }
  const related = state.incidents.filter((i) => i.track_id === track.id);
  const maneuverPct = track.maneuver_probability != null ? Math.round(track.maneuver_probability * 100) : null;
  const meterColor = maneuverPct == null ? "var(--border)" : maneuverPct < 33 ? "var(--active)" : maneuverPct < 66 ? "var(--medium)" : "var(--high)";

  el.innerHTML = `
    <div class="kv-section" style="padding-top:14px;">
      <span class="status-pill">${escapeHtml(track.status)}</span>
      <div class="detail-title-row">
        <div class="track-thumb" style="width:32px;height:32px;">${classIcon(track.classification)}</div>
        ${badge(track.classification, CLASS_COLOR[track.classification])}
        <span>Track ${track.id}</span>
      </div>
    </div>

    <div class="detail-actions">
      <button class="secondary" id="focus-btn">Focus</button>
      <button class="secondary ${state.follow ? "active" : ""}" id="follow-btn" aria-pressed="${state.follow}">${state.follow ? "Following" : "Follow"}</button>
    </div>

    <div class="kv-section">
      <div class="kv-section-title">Identity</div>
      <div class="kv-cols">
        <div class="kv">
          <div class="k">UID</div><div class="v" title="${escapeHtml(track.track_uid)}">${escapeHtml(track.track_uid.slice(0, 13))}…</div>
          <div class="k">First seen</div><div class="v">${fmtRelative(track.first_seen)}</div>
        </div>
        <div class="kv">
          <div class="k">Last seen</div><div class="v">${fmtRelative(track.last_seen)}</div>
          <div class="k">Incidents</div><div class="v">${related.length}</div>
        </div>
      </div>
    </div>

    <div class="kv-section">
      <div class="kv-section-title">Position &amp; motion</div>
      <div class="kv-cols">
        <div class="kv">
          <div class="k">Position</div><div class="v">${track.latitude != null ? `${track.latitude.toFixed(5)}, ${track.longitude.toFixed(5)}` : "—"}</div>
          <div class="k">Altitude</div><div class="v">${track.altitude_m != null ? Math.round(track.altitude_m) + " m" : "—"}</div>
        </div>
        <div class="kv">
          <div class="k">Heading</div><div class="v">${track.heading_deg != null ? headingArrow(track.heading_deg) + " " + Math.round(track.heading_deg) + "°" : "—"}</div>
          <div class="k">Speed</div><div class="v">${track.speed_mps != null ? track.speed_mps.toFixed(1) + " m/s" : "—"}</div>
        </div>
      </div>
    </div>

    <div class="kv-section">
      <div class="kv-section-title">Track quality</div>
      <div class="kv">
        <div class="k">Uncertainty</div><div class="v">${track.position_uncertainty_m != null ? "±" + Math.round(track.position_uncertainty_m) + " m" : "—"}</div>
        <div class="k">Maneuvering</div>
        <div class="v">
          ${maneuverPct != null ? maneuverPct + "%" : "—"}
          <div class="meter"><div class="meter-fill" style="width:${maneuverPct ?? 0}%; background:${meterColor}"></div></div>
        </div>
      </div>
      <div class="sparkline-wrap">
        ${state.trail.length > 1 ? trailSparkline(state.trail) : `<div class="empty" style="padding:4px 0;">${state.trail.length ? "" : "loading trail…"}</div>`}
      </div>
    </div>

    ${state.trail.length > 1 ? `
    <div class="kv-section" style="padding-bottom:14px;">
      <div class="kv-section-title">Playback</div>
      <div class="playback-row">
        <button class="secondary" id="play-btn">${playbackTimer != null ? "Pause" : "Play"}</button>
        <input type="range" id="scrub-range" min="0" max="${state.trail.length - 1}" step="1"
               value="${state.scrubIndex ?? state.trail.length - 1}">
        <span class="playback-time" id="scrub-time">${state.scrubIndex != null ? fmtTime(state.trail[state.scrubIndex].t) : "Live"}</span>
        <button class="secondary" id="live-btn" ${state.scrubIndex == null ? "disabled" : ""}>Live</button>
      </div>
    </div>` : ""}
  `;

  document.getElementById("focus-btn").addEventListener("click", () => flyToTrack(track.id, { animate: true }));
  document.getElementById("follow-btn").addEventListener("click", () => {
    state.follow = !state.follow;
    if (state.follow) flyToTrack(track.id, { animate: true });
    renderDetails();
  });
  const scrubRange = document.getElementById("scrub-range");
  if (scrubRange) scrubRange.addEventListener("input", (e) => setScrubIndex(Number(e.target.value)));
  const playBtn = document.getElementById("play-btn");
  if (playBtn) playBtn.addEventListener("click", togglePlayback);
  const liveBtn = document.getElementById("live-btn");
  if (liveBtn) liveBtn.addEventListener("click", goLive);
}

let leafletMap = null;
let zoneLayer = null;
let trackLayer = null;
let zoneDrawLayer = null;
let mapFitted = false;

function initMap() {
  // zoomControl:false + a manually-added bottom-right one, because the
  // default top-left position physically overlaps #map-layer-toggles
  // (top-center here) -- Leaflet's control sits on top and silently eats
  // clicks meant for whatever's underneath it. Bottom-right is clear of
  // the icon rail (left), floating panels (left/right), legend (bottom-
  // left), and layer toggles (top-center).
  leafletMap = L.map("map", { zoomControl: false }).setView([51.5, -0.1], 11);
  L.control.zoom({ position: "bottomright" }).addTo(leafletMap);

  const osmAttr = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  const cartoAttr = osmAttr + ' &copy; <a href="https://carto.com/attributions">CARTO</a>';
  const esriAttr = "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS community";

  const darkLayer = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: cartoAttr, subdomains: "abcd", maxZoom: 19,
  });
  const roadLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: osmAttr, maxZoom: 19,
  });
  const satelliteLayer = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { attribution: esriAttr, maxZoom: 19 }
  );
  const satelliteLabels = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    { attribution: esriAttr, maxZoom: 19 }
  );

  darkLayer.addTo(leafletMap);
  L.control
    .layers(
      { Dark: darkLayer, Road: roadLayer, Satellite: satelliteLayer },
      { "Satellite labels": satelliteLabels },
      { position: "topright", collapsed: true }
    )
    .addTo(leafletMap);

  // The labels overlay only makes sense on top of Satellite -- drop it
  // automatically when switching to a different base layer, since Leaflet
  // doesn't couple overlays to a specific base layer on its own. Deferred
  // via setTimeout so it runs after the control's own click handling
  // finishes -- removing it synchronously happens while Leaflet's internal
  // _handlingClick guard is still set, which silently skips re-syncing the
  // control's checkbox even though the layer is actually removed.
  leafletMap.on("baselayerchange", (e) => {
    if (e.name !== "Satellite" && leafletMap.hasLayer(satelliteLabels)) {
      setTimeout(() => leafletMap.removeLayer(satelliteLabels), 0);
    }
  });

  zoneLayer = L.layerGroup().addTo(leafletMap);
  trackLayer = L.layerGroup().addTo(leafletMap);

  document.getElementById("toggle-trail").addEventListener("change", (e) => {
    state.showTrail = e.target.checked;
    renderMap();
  });
  document.getElementById("toggle-vectors").addEventListener("change", (e) => {
    state.showVectors = e.target.checked;
    renderMap();
  });
  document.getElementById("toggle-uncertainty").addEventListener("change", (e) => {
    state.showUncertainty = e.target.checked;
    renderMap();
  });
}

// A distinct shape per classification (not just color) so markers are
// tellable apart at a glance even for a viewer with red/green color
// vision deficiency, plus a heading arrow overlay for the selected track.
function markerIcon(track, selected) {
  const color = CLASS_COLOR_HEX[track.classification] || CLASS_COLOR_HEX.unknown;
  const size = selected ? 24 : 16;
  const half = size / 2;
  const stroke = selected ? '#fff' : 'rgba(255,255,255,0.35)';
  const strokeWidth = selected ? 2 : 1;
  let shape;
  if (track.classification === "aircraft") {
    shape = `<polygon points="${half},1 ${size - 1},${size - 1} ${half},${size - 5} 1,${size - 1}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}"/>`;
  } else if (track.classification === "bird") {
    shape = `<circle cx="${half}" cy="${half}" r="${half - 3}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}"/>`;
  } else {
    shape = `<circle cx="${half}" cy="${half}" r="${half - 2}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}"/>`;
  }
  const rotation = track.heading_deg != null ? `transform:rotate(${track.heading_deg}deg);` : "";
  const html = `<div style="width:${size}px;height:${size}px;${rotation}">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${shape}</svg>
  </div>`;
  return L.divIcon({ html, className: "", iconSize: [size, size], iconAnchor: [half, half] });
}

function renderMap() {
  zoneLayer.clearLayers();
  trackLayer.clearLayers();

  state.zones.forEach((z) => {
    // Amber, deliberately distinct from any classification color -- a
    // zone outline reusing the drone-classification red made a restricted
    // zone visually indistinguishable from an actual drone marker/
    // uncertainty ring at a glance, especially once the map got bigger.
    L.polygon(z.polygon, {
      color: "#f59e0b",
      weight: 1.5,
      fillColor: "#f59e0b",
      fillOpacity: 0.08,
    })
      .bindPopup(escapeHtml(z.name))
      .addTo(zoneLayer);
  });

  if (state.showTrail && state.trail.length > 1) {
    L.polyline(state.trail.map((p) => [p.lat, p.lon]), { color: "#fff", weight: 2, opacity: 0.7, dashArray: "4 4" })
      .addTo(trackLayer);
  }

  const pts = visibleTracks().filter((t) => t.latitude != null && t.longitude != null);

  // Short fading breadcrumb trail per visible track, from recently polled
  // positions (breadcrumbs) -- unlike the selected track's full history
  // line above, this works for every track without a per-track history
  // fetch. Drawn as one short segment per pair of consecutive points, each
  // more opaque than the last, so the trail reads as "recent motion" with
  // a clear front/back rather than a static, directionless line.
  if (state.showTrail) {
    pts.forEach((t) => {
      const points = breadcrumbs.get(t.id);
      if (!points || points.length < 2) return;
      const color = CLASS_COLOR_HEX[t.classification] || CLASS_COLOR_HEX.unknown;
      for (let i = 1; i < points.length; i++) {
        const age = i / (points.length - 1); // 0 (oldest segment) -> 1 (newest)
        L.polyline(
          [[points[i - 1].lat, points[i - 1].lon], [points[i].lat, points[i].lon]],
          { color, weight: 2, opacity: 0.15 + age * 0.45 }
        ).addTo(trackLayer);
      }
    });
  }

  pts.forEach((t) => {
    const selected = t.id === state.selectedTrackId;
    const scrubbing = selected && state.scrubIndex != null;

    if (selected && state.showUncertainty && t.position_uncertainty_m) {
      const uColor = CLASS_COLOR_HEX[t.classification] || CLASS_COLOR_HEX.unknown;
      L.circle([t.latitude, t.longitude], {
        radius: t.position_uncertainty_m,
        color: uColor,
        weight: 2,
        opacity: 0.9,
        fillColor: uColor,
        fillOpacity: 0.18,
        dashArray: "4 4",
      }).addTo(trackLayer);
    }

    // A real great-circle projection of where this track will be in
    // VECTOR_HORIZON_S seconds if it holds its current heading/speed --
    // not just a color, an actual bearing a viewer can read off the map,
    // the same way RF direction-finding bearings are shown.
    if (state.showVectors && t.heading_deg != null && t.speed_mps != null && t.speed_mps >= MIN_VECTOR_SPEED_MPS) {
      const tip = destinationPoint(t.latitude, t.longitude, t.heading_deg, t.speed_mps * VECTOR_HORIZON_S);
      L.polyline([[t.latitude, t.longitude], tip], {
        color: CLASS_COLOR_HEX[t.classification] || CLASS_COLOR_HEX.unknown,
        weight: selected ? 2 : 1.5,
        opacity: 0.8,
        dashArray: "1 5",
        lineCap: "round",
      }).addTo(trackLayer);
    }

    const marker = L.marker([t.latitude, t.longitude], { icon: markerIcon(t, selected) })
      .on("click", () => selectTrack(t.id))
      .addTo(trackLayer);
    // Dim the live marker while scrubbing history for this track -- the
    // ghost marker below (at the scrubbed position) is the one that
    // should draw the eye.
    if (scrubbing) marker.setOpacity(0.35);

    const labelParts = [`#${t.id}`, t.classification];
    if (t.speed_mps != null) labelParts.push(`${t.speed_mps.toFixed(1)} m/s`);
    const label = labelParts.join(" · ");
    if (selected && !scrubbing) {
      marker.bindTooltip(label, { permanent: true, direction: "top", offset: [0, -14], className: "track-tooltip" });
    } else {
      // Non-permanent (hover-only) for an unselected track, and also for
      // the selected track's live marker while scrubbing its history --
      // dimmed context at that point, not the focal point, so a permanent
      // label would just compete with the ghost marker's below.
      marker.bindTooltip(label, { direction: "top", offset: [0, -10], className: "track-tooltip" });
    }
  });

  if (state.selectedTrackId != null && state.scrubIndex != null && state.trail[state.scrubIndex]) {
    const point = state.trail[state.scrubIndex];
    const selTrack = state.tracks.find((tr) => tr.id === state.selectedTrackId);
    const color = CLASS_COLOR_HEX[(selTrack && selTrack.classification) || "unknown"] || CLASS_COLOR_HEX.unknown;
    const ghostHtml = `<div style="width:20px;height:20px;">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <circle cx="10" cy="10" r="7" fill="${color}" fill-opacity="0.25" stroke="${color}" stroke-width="2" stroke-dasharray="3 2"/>
      </svg>
    </div>`;
    L.marker([point.lat, point.lon], {
      icon: L.divIcon({ html: ghostHtml, className: "", iconSize: [20, 20], iconAnchor: [10, 10] }),
      zIndexOffset: 500,
    })
      .bindTooltip(`history · ${fmtTime(point.t)}`, { permanent: true, direction: "top", offset: [0, -12], className: "track-tooltip" })
      .addTo(trackLayer);
  }

  if (state.follow && state.selectedTrackId != null) {
    flyToTrack(state.selectedTrackId, { animate: false });
  } else if (!mapFitted) {
    const allPts = [...pts.map((t) => [t.latitude, t.longitude]), ...state.zones.flatMap((z) => z.polygon)];
    if (allPts.length > 0) {
      leafletMap.fitBounds(allPts, { padding: [20, 20], maxZoom: 15 });
      mapFitted = true;
    }
  }
}

// Append each track's current position to its breadcrumb trail (skipping
// an unchanged position, so a stationary/hovering track doesn't pile up
// identical points instead of an actual trail), capped by both point count
// and age. Drops breadcrumbs for any track that no longer appears at all
// (closed/expired) so the map doesn't accumulate stale entries forever.
function recordBreadcrumbs(tracks) {
  const now = Date.now();
  const seen = new Set();
  tracks.forEach((t) => {
    if (t.latitude == null || t.longitude == null) return;
    seen.add(t.id);
    const points = breadcrumbs.get(t.id) || [];
    const last = points[points.length - 1];
    if (!last || last.lat !== t.latitude || last.lon !== t.longitude) {
      points.push({ lat: t.latitude, lon: t.longitude, t: now });
    }
    while (points.length > BREADCRUMB_MAX_POINTS) points.shift();
    while (points.length > 1 && now - points[0].t > BREADCRUMB_MAX_AGE_MS) points.shift();
    breadcrumbs.set(t.id, points);
  });
  for (const id of Array.from(breadcrumbs.keys())) {
    if (!seen.has(id)) breadcrumbs.delete(id);
  }
}

function renderSensors() {
  const el = document.getElementById("sensors-table");
  if (state.sensors.length === 0) {
    el.innerHTML = `<div class="empty-guidance">
      <div class="empty-title">No sensors connected</div>
      <div class="empty-body">A sensor appears here automatically the first time it reports a detection -- nothing to register or configure in advance.</div>
      <ol class="empty-checklist">
        <li>Point your sensor/adapter at <code>POST /api/detections</code> on this server</li>
        <li>Include a <code>sensor_id</code>, <code>sensor_type</code>, and a position (or azimuth/range from a registered mount)</li>
        <li>If an API key is configured, send it as the <code>X-API-Key</code> header</li>
      </ol>
    </div>`;
    return;
  }
  const rows = state.sensors
    .map((s) => `<tr>
        <td>${escapeHtml(s.sensor_id)}</td>
        <td>${escapeHtml(s.sensor_type)}</td>
        <td><span class="status-dot" style="background:${SENSOR_STATUS_COLOR[s.status] || SENSOR_STATUS_COLOR.offline}"></span> ${escapeHtml(s.status)}</td>
        <td>${fmtRelative(s.last_seen)}</td>
      </tr>`)
    .join("");
  el.innerHTML = `<table>
    <thead><tr><th>Sensor ID</th><th>Type</th><th>Status</th><th>Seen</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// --- Zone management: draw a polygon on the map, then POST/PUT it via
// /api/zones (admin-only) -- previously the only way to add or change a
// restricted zone was hand-editing app/zones.seed.json and restarting
// the app. -------------------------------------------------------------

function renderZones() {
  const el = document.getElementById("zones-list");
  if (state.allZones.length === 0) {
    el.innerHTML = '<div class="empty">No zones defined yet. Click "+ New zone" above, then click points on the map to draw one.</div>';
    return;
  }
  el.innerHTML = state.allZones
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name))
    .map((z) => `
      <div class="zone-item">
        <div class="top-row">
          <span class="name${z.active ? "" : " inactive"}">${escapeHtml(z.name)}</span>
          <span style="color:var(--muted); font-size:11px;">${escapeHtml(z.zone_type)}</span>
        </div>
        <div class="actions">
          <button class="secondary" data-zone-edit="${z.id}">Edit</button>
          <button class="secondary" data-zone-toggle="${z.id}">${z.active ? "Deactivate" : "Activate"}</button>
        </div>
      </div>`)
    .join("");
  el.querySelectorAll("[data-zone-edit]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const zone = state.allZones.find((z) => z.id === Number(btn.dataset.zoneEdit));
      if (zone) startZoneDraw(zone);
    });
  });
  el.querySelectorAll("[data-zone-toggle]").forEach((btn) => {
    btn.addEventListener("click", () => toggleZoneActive(Number(btn.dataset.zoneToggle)));
  });
}

async function toggleZoneActive(zoneId) {
  const zone = state.allZones.find((z) => z.id === zoneId);
  if (!zone) return;
  try {
    await fetchJSON(`/api/zones/${zoneId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...zone, active: !zone.active }),
    });
    await refresh();
  } catch (e) {
    if (e instanceof AuthError) showAuthBar(true);
    console.error(e);
  }
}

function startZoneDraw(existingZone) {
  cancelZoneDraw();
  showPanel("zones");
  state.zoneDraft = {
    points: existingZone ? existingZone.polygon.map((p) => [p[0], p[1]]) : [],
    editingZoneId: existingZone ? existingZone.id : null,
    original: existingZone || null,
  };
  zoneDrawLayer = L.layerGroup().addTo(leafletMap);
  leafletMap.getContainer().style.cursor = "crosshair";
  leafletMap.on("click", onZoneDrawClick);
  document.getElementById("zone-draw-hint").style.display = "block";
  updateZoneDrawHint();
  redrawZoneDraft();
  showZoneForm(existingZone);
}

function onZoneDrawClick(e) {
  state.zoneDraft.points.push([e.latlng.lat, e.latlng.lng]);
  redrawZoneDraft();
  updateZoneDrawHint();
}

function redrawZoneDraft() {
  zoneDrawLayer.clearLayers();
  const pts = state.zoneDraft.points;
  pts.forEach((p) => L.circleMarker(p, { radius: 4, color: "#f59e0b", fillColor: "#f59e0b", fillOpacity: 1 }).addTo(zoneDrawLayer));
  if (pts.length >= 2) {
    L.polyline(pts, { color: "#f59e0b", weight: 2, dashArray: "4 4" }).addTo(zoneDrawLayer);
  }
  if (pts.length >= 3) {
    L.polygon(pts, { color: "#f59e0b", weight: 2, fillOpacity: 0.15 }).addTo(zoneDrawLayer);
  }
}

function updateZoneDrawHint() {
  const n = state.zoneDraft.points.length;
  document.getElementById("zone-draw-hint").textContent =
    n < 3
      ? `Click the map to add a point (${n} so far -- need at least 3 to form a zone).`
      : `${n} points -- click to add more, or fill in the form below and save.`;
}

function cancelZoneDraw() {
  if (zoneDrawLayer) {
    leafletMap.removeLayer(zoneDrawLayer);
    zoneDrawLayer = null;
  }
  if (leafletMap) {
    leafletMap.off("click", onZoneDrawClick);
    leafletMap.getContainer().style.cursor = "";
  }
  state.zoneDraft = null;
  document.getElementById("zone-draw-hint").style.display = "none";
  document.getElementById("zone-form").style.display = "none";
}

const ZONE_TYPES = ["restricted", "no_fly", "monitoring", "safe"];

function showZoneForm(existingZone) {
  const form = document.getElementById("zone-form");
  form.style.display = "block";
  form.innerHTML = `
    <label for="zone-name-input">Name</label>
    <input id="zone-name-input" type="text" value="${existingZone ? escapeHtml(existingZone.name) : ""}">
    <label for="zone-type-input">Type</label>
    <select id="zone-type-input">
      ${ZONE_TYPES.map((t) => `<option value="${t}" ${existingZone && existingZone.zone_type === t ? "selected" : ""}>${t}</option>`).join("")}
    </select>
    <div class="row">
      <div>
        <label for="zone-min-alt-input">Min altitude (m)</label>
        <input id="zone-min-alt-input" type="number" placeholder="none" value="${existingZone && existingZone.min_altitude_m != null ? existingZone.min_altitude_m : ""}">
      </div>
      <div>
        <label for="zone-max-alt-input">Max altitude (m)</label>
        <input id="zone-max-alt-input" type="number" placeholder="none" value="${existingZone && existingZone.max_altitude_m != null ? existingZone.max_altitude_m : ""}">
      </div>
    </div>
    <div class="actions">
      <button id="zone-save-btn">${existingZone ? "Save changes" : "Create zone"}</button>
      <button class="secondary" id="zone-cancel-btn">Cancel</button>
    </div>
    <div id="zone-form-error"></div>
  `;
  document.getElementById("zone-save-btn").addEventListener("click", saveZoneDraft);
  document.getElementById("zone-cancel-btn").addEventListener("click", cancelZoneDraw);
}

async function saveZoneDraft() {
  const draft = state.zoneDraft;
  const errorEl = document.getElementById("zone-form-error");
  errorEl.textContent = "";
  if (draft.points.length < 3) {
    errorEl.textContent = "Draw at least 3 points on the map first.";
    return;
  }
  const name = document.getElementById("zone-name-input").value.trim();
  if (!name) {
    errorEl.textContent = "Name is required.";
    return;
  }
  const parseAlt = (id) => {
    const v = document.getElementById(id).value;
    return v === "" ? null : Number(v);
  };
  const body = {
    name,
    zone_type: document.getElementById("zone-type-input").value,
    polygon: draft.points,
    min_altitude_m: parseAlt("zone-min-alt-input"),
    max_altitude_m: parseAlt("zone-max-alt-input"),
    active: draft.original ? draft.original.active : true,
  };
  try {
    const url = draft.editingZoneId ? `/api/zones/${draft.editingZoneId}` : "/api/zones";
    const method = draft.editingZoneId ? "PUT" : "POST";
    await fetchJSON(url, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    cancelZoneDraw();
    await refresh();
  } catch (e) {
    if (e instanceof AuthError) {
      showAuthBar(true);
      errorEl.textContent = "Not authorized -- an admin API key is required to manage zones.";
    } else {
      errorEl.textContent = `Save failed: ${e.message}`;
    }
    console.error(e);
  }
}

document.getElementById("zone-new-btn").addEventListener("click", () => startZoneDraw(null));

async function refresh() {
  try {
    const [tracks, incidents, zones, sensors, allZones] = await Promise.all([
      fetchJSON("/api/tracks"),
      fetchJSON("/api/incidents"),
      fetchJSON("/api/zones"),
      fetchJSON("/api/sensors"),
      // Separate from `zones` above (active-only, what the map draws) --
      // the zone-management panel also needs to show/reactivate a
      // deactivated zone, which the map deliberately never renders.
      fetchJSON("/api/zones?include_inactive=true"),
    ]);
    state.tracks = tracks;
    state.incidents = incidents;
    state.zones = zones;
    state.sensors = sensors;
    state.allZones = allZones;
    recordBreadcrumbs(tracks);
    showAuthBar(false);
    renderTracks();
    renderAlerts();
    renderMap();
    renderDetails();
    renderSensors();
    renderZones();
    const activeCount = incidents.filter((i) => i.status !== "resolved").length;
    const alertPart = activeCount > 0
      ? `<span style="color:var(--high); font-weight:700;">${activeCount} active alert${activeCount === 1 ? "" : "s"}</span>`
      : "0 active alerts";
    document.getElementById("status-line").innerHTML =
      `updated ${new Date().toLocaleTimeString()} · ${tracks.length} tracks · ${alertPart}`;
  } catch (e) {
    if (e instanceof AuthError) {
      showAuthBar(true);
      document.getElementById("status-line").textContent = "waiting for API key…";
    } else {
      document.getElementById("status-line").textContent = "connection error — retrying…";
    }
    console.error(e);
  }
}

document.getElementById("auth-save").addEventListener("click", () => {
  const input = document.getElementById("auth-input");
  apiKey = input.value.trim();
  localStorage.setItem("droneApiKey", apiKey);
  refresh();
  // The live socket authenticates via its own connection-time query
  // param (see connectLiveSocket()) -- a key entered after an earlier
  // rejected/unauthenticated connection needs a fresh connection to
  // actually take effect, not just the next HTTP request.
  disconnectLiveSocket();
  connectLiveSocket();
});
document.getElementById("auth-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("auth-save").click();
});
document.getElementById("search-input").addEventListener("input", (e) => {
  state.search = e.target.value;
  renderTracks();
  renderMap();
});
document.querySelectorAll(".rail-btn").forEach((btn) => {
  btn.addEventListener("click", () => toggleOrShowPanel(btn.dataset.panel));
});
document.getElementById("details-back").addEventListener("click", deselectTrack);
document.getElementById("details-close").addEventListener("click", deselectTrack);
// Number-key shortcuts to jump straight to a track by its position in the
// currently-visible (filtered) table, without needing to click first.
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const n = Number(e.key);
  if (n >= 1 && n <= 9) {
    const tracks = visibleTracks().slice().sort((a, b) => (a.last_seen < b.last_seen ? 1 : -1));
    if (tracks[n - 1]) selectTrack(tracks[n - 1].id);
  }
});

let pollTimer = null;

function startPolling() {
  if (pollTimer !== null) return;
  pollTimer = setInterval(refresh, POLL_MS);
}

function stopPolling() {
  if (pollTimer === null) return;
  clearInterval(pollTimer);
  pollTimer = null;
}

// Pushes a refresh within milliseconds of a new detection/incident,
// instead of waiting for the next POLL_MS tick -- see app/live.py and
// app/api/live.py. On any message this just calls refresh() again
// (the same fetch a poll would do) rather than trying to patch state
// incrementally from the push payload -- one rendering path to keep
// correct, not two.
let liveSocket = null;
let liveReconnectTimer = null;

function connectLiveSocket() {
  if (liveSocket !== null) return;
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const url = `${proto}//${location.host}/ws/live${apiKey ? `?api_key=${encodeURIComponent(apiKey)}` : ""}`;
  const ws = new WebSocket(url);
  liveSocket = ws;
  ws.addEventListener("message", refresh);
  ws.addEventListener("close", (event) => {
    liveSocket = null;
    // 4401/4403 (see app/api/live.py) mean the key is missing/wrong/
    // lacks access -- reconnecting every few seconds against the same
    // rejected key would just spam the server for no benefit; the
    // auth-save handler below reconnects once a key is actually entered.
    if (document.hidden || event.code === 4401 || event.code === 4403) return;
    liveReconnectTimer = setTimeout(connectLiveSocket, 3000);
  });
  ws.addEventListener("error", () => ws.close());
}

function disconnectLiveSocket() {
  if (liveReconnectTimer !== null) {
    clearTimeout(liveReconnectTimer);
    liveReconnectTimer = null;
  }
  if (liveSocket !== null) {
    liveSocket.close();
    liveSocket = null;
  }
}

// A hidden/backgrounded tab has no visible map or track list to update, so
// polling the API every few seconds (or holding a live socket open) there
// just burns battery and load for nothing. Refresh once immediately on
// return so the view isn't stale from whenever it was backgrounded.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopPolling();
    disconnectLiveSocket();
  } else {
    refresh();
    startPolling();
    connectLiveSocket();
  }
});

renderClassFilters();
initMap();
refresh();
if (!document.hidden) {
  startPolling();
  connectLiveSocket();
}
</script>
</body>
</html>
