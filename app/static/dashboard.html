<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drone Multi-Sensor Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0b1120;
    --panel: #1e293b;
    --panel-2: #182234;
    --border: #2b3648;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --active: #22c55e;
    --lost: #d99b1f;
    --closed: #6b7280;
    --drone: #ef4444;
    --aircraft: #3b82f6;
    --bird: #22c55e;
    --friendly: #14b8b0;
    --unknown: #8b93a7;
    --critical: #b91c1c;
    --high: #ef4444;
    --medium: #d99b1f;
    --low: #6b7280;
    --online: #22c55e;
    --stale: #d99b1f;
    --offline: #6b7280;
    --accent: #2563eb;
    --zone: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--active); box-shadow: 0 0 0 rgba(34,197,94,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.55); }
    70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }
  #status-line { color: var(--muted); font-size: 12px; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .filter-chip {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; user-select: none;
  }
  .filter-chip:hover { color: var(--text); border-color: #3a4763; }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #search-input {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 5px 12px; font-size: 12px; width: 150px;
  }
  #search-input:focus { outline: none; border-color: var(--accent); }
  main {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 14px;
    padding: 14px 20px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 10px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel h2 .count { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #24314a; }
  tbody tr.selected { background: #1d3a5f; box-shadow: inset 3px 0 0 var(--accent); }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    color: #0b1120;
  }
  .badge-outline {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 9px; border-radius: 10px; font-size: 11px; font-weight: 600;
    border: 1px solid currentColor;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  /* Map leads: it's the primary situational-awareness surface, so it
     spans both rows on the wide left column instead of competing for
     space with the data panels. Alerts sit underneath it (alerts are
     spatial events, visually associated with the map above them); Live
     Tracks, Selected Track, and Sensor Health form the operator's data
     column on the right, in the order you'd actually use them: pick a
     track, read its details, check sensor health. */
  #map-wrap { grid-column: 1; grid-row: 1 / span 2; padding: 0; overflow: hidden; }
  #map-wrap h2 { padding: 12px 14px 0 14px; margin-bottom: 8px; }
  #alerts-wrap { grid-column: 1; grid-row: 3; }
  #tracks-wrap { grid-column: 2; grid-row: 1; }
  #details-wrap { grid-column: 2; grid-row: 2; }
  #sensors-wrap { grid-column: 2; grid-row: 3; }
  #map { width: 100%; height: 620px; background: #0b0f19; }
  #map-legend {
    position: absolute; z-index: 500; bottom: 10px; left: 10px;
    background: rgba(15,20,32,0.85); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 11px; color: var(--muted); backdrop-filter: blur(4px);
  }
  #map-legend .item { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #map-layer-toggles {
    position: absolute; z-index: 500; top: 10px; left: 10px;
    background: rgba(15,20,32,0.85); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 11px; color: var(--muted); backdrop-filter: blur(4px);
    display: flex; gap: 12px;
  }
  #map-layer-toggles label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .map-container { position: relative; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
  .leaflet-container { font-family: inherit; background: #0b0f19; }
  .leaflet-control-layers {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
  }
  .leaflet-control-layers-toggle { filter: invert(1) hue-rotate(180deg); }
  .leaflet-control-layers-separator { border-color: var(--border); }
  .track-tooltip {
    background: rgba(15,20,32,0.92) !important; border: 1px solid var(--border) !important;
    color: var(--text) !important; font-size: 11px !important; padding: 4px 8px !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important;
  }
  .track-tooltip::before { display: none !important; }
  .empty { color: var(--muted); font-style: italic; padding: 10px 0; }
  .empty-ok { color: var(--muted); padding: 14px 0; display: flex; align-items: center; gap: 8px; }
  .empty-ok .check { color: var(--active); font-size: 16px; }
  .alert-item {
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .alert-item.sev-critical { border-left-color: var(--critical); }
  .alert-item.sev-high { border-left-color: var(--high); }
  .alert-item.sev-medium { border-left-color: var(--medium); }
  .alert-item.sev-low { border-left-color: var(--low); }
  .alert-item .top-row { display: flex; justify-content: space-between; align-items: center; }
  .alert-item .desc { color: var(--muted); margin: 6px 0; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 5px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: var(--border); color: var(--muted); cursor: default; }
  button.secondary { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
  button.secondary:hover { background: #24314a; }
  button.secondary.active { background: var(--accent); border-color: var(--accent); }
  .detail-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .detail-header .title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .detail-actions { display: flex; gap: 6px; }
  .kv-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 8px; align-content: start; }
  .kv .k { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .kv .v { font-size: 13px; }
  .kv-section + .kv-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .kv-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 8px 0;
  }
  .meter { background: var(--panel-2); border-radius: 999px; height: 6px; overflow: hidden; margin-top: 4px; }
  .meter-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
  .sparkline-wrap { margin-top: 4px; }
  .heading-arrow { display: inline-block; font-size: 14px; }
  .playback-row { display: flex; align-items: center; gap: 8px; }
  .playback-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .playback-time { font-size: 11px; color: var(--muted); min-width: 74px; text-align: right; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Drone Multi-Sensor Dashboard</h1>
    <span class="live-dot" title="Live"></span>
    <div id="status-line">loading…</div>
  </div>
  <div class="header-right">
    <input id="search-input" type="text" placeholder="Search ID or UID…">
    <div id="class-filters"></div>
  </div>
</header>

<div id="auth-bar" style="display:none; padding:10px 20px; background:#2a1620; border-bottom:1px solid var(--border); gap:8px; align-items:center;">
  <span style="color:var(--drone);">API key required or rejected.</span>
  <input id="auth-input" type="password" placeholder="X-API-Key" style="background:#0b0f19; border:1px solid var(--border); color:var(--text); border-radius:4px; padding:4px 8px;">
  <button id="auth-save">Save key</button>
</div>

<main>
  <section class="panel" id="map-wrap">
    <h2>Map</h2>
    <div class="map-container">
      <div id="map"></div>
      <div id="map-layer-toggles">
        <label><input type="checkbox" id="toggle-trail" checked> Trails</label>
        <label><input type="checkbox" id="toggle-vectors" checked> Vectors</label>
        <label><input type="checkbox" id="toggle-uncertainty" checked> Uncertainty</label>
      </div>
      <div id="map-legend">
        <div class="item"><span class="dot" style="background:var(--drone)"></span>Drone</div>
        <div class="item"><span class="dot" style="background:var(--aircraft)"></span>Aircraft</div>
        <div class="item"><span class="dot" style="background:var(--bird)"></span>Bird</div>
        <div class="item"><span class="dot" style="background:var(--friendly)"></span>Friendly</div>
        <div class="item"><span class="dot" style="background:var(--unknown)"></span>Unknown</div>
        <div class="item"><span class="dot" style="background:var(--zone); opacity:0.6;"></span>Restricted zone</div>
        <!-- 30s matches VECTOR_HORIZON_S below; this is static markup (not
             a template literal), so it can't interpolate the JS constant. -->
        <div class="item"><span style="display:inline-block;width:14px;height:0;border-top:2px dotted var(--muted);"></span>Projected path (30s)</div>
      </div>
    </div>
  </section>

  <section class="panel" id="tracks-wrap">
    <h2>Live Tracks <span class="count" id="tracks-count"></span></h2>
    <div id="tracks-table"></div>
  </section>

  <section class="panel" id="details-wrap">
    <h2>Selected Track</h2>
    <div id="track-details"></div>
  </section>

  <section class="panel" id="alerts-wrap">
    <h2>Active Alerts <span class="count" id="alerts-count"></span></h2>
    <div id="alerts-list"></div>
  </section>

  <section class="panel" id="sensors-wrap">
    <h2>Sensor Health</h2>
    <div id="sensors-table"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const POLL_MS = 3000;

const state = {
  tracks: [], incidents: [], zones: [], sensors: [],
  selectedTrackId: null, trail: [], classFilter: "all", search: "",
  follow: false, showTrail: true, showUncertainty: true, showVectors: true,
  // null == showing each track's live position; otherwise an index into
  // `trail` (the selected track's full history, oldest first) being
  // scrubbed to via the Playback slider in the details panel.
  scrubIndex: null,
};
let apiKey = localStorage.getItem("droneApiKey") || "";

// Recent on-map positions per track, captured from each poll (not fetched
// history) so every visible track can show a short fading trail without a
// per-track history request every 3s -- only the *selected* track gets its
// full server-side history (state.trail, fetched once on selection).
const breadcrumbs = new Map();
const BREADCRUMB_MAX_POINTS = 12;
const BREADCRUMB_MAX_AGE_MS = 10 * 60 * 1000;
let playbackTimer = null;
const PLAYBACK_INTERVAL_MS = 300;
// Fixed visual projection horizon for the map's speed-vector line -- matches
// PREDICTIVE_HORIZON_SECONDS' documented default (app/config.py), but this
// is a client-side visual aid, not read from live server config, so it
// won't track a deployment that overrides that env var.
const VECTOR_HORIZON_S = 30;
// Mirrors app/incidents.py's _MIN_SPEED_FOR_PROJECTION_MPS: near-zero speed
// makes a Kalman-filtered heading too noisy to draw a meaningful vector.
const MIN_VECTOR_SPEED_MPS = 1.0;

// Spherical-earth forward geodesic, ported from app/geo.py's
// destination_point so the drawn speed vector matches the same math the
// backend uses for predictive-incursion projection, not a flat lat/lon-
// degree approximation that distorts increasingly at higher latitudes.
function destinationPoint(lat, lon, bearingDeg, distanceM) {
  const R = 6371000.0;
  const angularDistance = distanceM / R;
  const bearingRad = (bearingDeg * Math.PI) / 180;
  const lat1Rad = (lat * Math.PI) / 180;
  const lat2Rad = Math.asin(
    Math.sin(lat1Rad) * Math.cos(angularDistance) +
      Math.cos(lat1Rad) * Math.sin(angularDistance) * Math.cos(bearingRad)
  );
  const lon2Rad =
    (lon * Math.PI) / 180 +
    Math.atan2(
      Math.sin(bearingRad) * Math.sin(angularDistance) * Math.cos(lat1Rad),
      Math.cos(angularDistance) - Math.sin(lat1Rad) * Math.sin(lat2Rad)
    );
  return [(lat2Rad * 180) / Math.PI, (lon2Rad * 180) / Math.PI];
}

const CLASS_COLOR = {
  drone: "var(--drone)", aircraft: "var(--aircraft)", bird: "var(--bird)",
  friendly: "var(--friendly)", unknown: "var(--unknown)",
};
// Leaflet needs real hex/rgb values in inline SVG -- CSS custom properties
// don't resolve inside a divIcon's raw HTML string.
const CLASS_COLOR_HEX = {
  drone: "#ef4444", aircraft: "#3b82f6", bird: "#22c55e",
  friendly: "#14b8b0", unknown: "#8b93a7",
};
const STATUS_COLOR = { active: "var(--active)", lost: "var(--lost)", closed: "var(--closed)" };
const SEVERITY_COLOR = { critical: "var(--critical)", high: "var(--high)", medium: "var(--medium)", low: "var(--low)" };
const SENSOR_STATUS_COLOR = { online: "var(--online)", stale: "var(--stale)", offline: "var(--offline)" };
const CLASS_LABELS = ["all", "drone", "aircraft", "bird", "friendly", "unknown"];

class AuthError extends Error {}

async function fetchJSON(url, opts) {
  const headers = { ...(opts && opts.headers), ...(apiKey ? { "X-API-Key": apiKey } : {}) };
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401) throw new AuthError(`${url} -> 401`);
  if (!res.ok) throw new Error(`${url} -> ${res.status}`);
  return res.json();
}

function showAuthBar(show) {
  document.getElementById("auth-bar").style.display = show ? "flex" : "none";
}

function fmtTime(iso) {
  if (!iso) return "—";
  return new Date(iso + (iso.endsWith("Z") ? "" : "Z")).toLocaleTimeString();
}

// Relative "13s ago" / "5m ago" style formatting -- easier to scan at a
// glance than an absolute clock time, especially for "is this feed still
// alive" questions.
function fmtRelative(iso) {
  if (!iso) return "—";
  const then = new Date(iso + (iso.endsWith("Z") ? "" : "Z")).getTime();
  const diffS = Math.max(0, Math.round((Date.now() - then) / 1000));
  if (diffS < 5) return "just now";
  if (diffS < 60) return `${diffS}s ago`;
  const diffM = Math.round(diffS / 60);
  if (diffM < 60) return `${diffM}m ago`;
  const diffH = Math.round(diffM / 60);
  if (diffH < 24) return `${diffH}h ago`;
  return `${Math.round(diffH / 24)}d ago`;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function badge(text, color) {
  return `<span class="badge" style="background:${color}">${escapeHtml(text)}</span>`;
}

function badgeOutline(text, color) {
  return `<span class="badge-outline" style="color:${color}">${escapeHtml(text)}</span>`;
}

function headingArrow(headingDeg) {
  if (headingDeg == null) return "";
  return `<span class="heading-arrow" style="display:inline-block;transform:rotate(${headingDeg}deg)">&#8593;</span>`;
}

function visibleTracks() {
  const search = state.search.trim().toLowerCase();
  return state.tracks.filter((t) => {
    if (state.classFilter !== "all" && t.classification !== state.classFilter) return false;
    if (!search) return true;
    return String(t.id).includes(search) || t.track_uid.toLowerCase().includes(search);
  });
}

async function selectTrack(id) {
  state.selectedTrackId = id;
  state.trail = [];
  state.scrubIndex = null;
  stopPlayback();
  renderTracks();
  renderMap();
  renderDetails();
  flyToTrack(id, { animate: true });

  try {
    const history = await fetchJSON(`/api/tracks/${id}/history?limit=2000`);
    if (state.selectedTrackId !== id) return; // a newer selection has since won
    state.trail = history
      .filter((d) => d.latitude != null && d.longitude != null)
      .map((d) => ({ lat: d.latitude, lon: d.longitude, t: d.timestamp }));
    renderMap();
    renderDetails();
  } catch (e) {
    if (e instanceof AuthError) showAuthBar(true);
    console.error(e);
  }
}

// --- Timeline scrubber: replay the selected track's full history
// (state.trail, oldest first) instead of only ever showing its live
// position. ------------------------------------------------------------

function stopPlayback() {
  if (playbackTimer != null) {
    clearInterval(playbackTimer);
    playbackTimer = null;
  }
}

function updatePlaybackUI() {
  const range = document.getElementById("scrub-range");
  const timeLabel = document.getElementById("scrub-time");
  const playBtn = document.getElementById("play-btn");
  const liveBtn = document.getElementById("live-btn");
  if (range) range.value = String(state.scrubIndex ?? state.trail.length - 1);
  if (timeLabel) {
    timeLabel.textContent = state.scrubIndex != null ? fmtTime(state.trail[state.scrubIndex].t) : "Live";
  }
  if (playBtn) playBtn.textContent = playbackTimer != null ? "Pause" : "Play";
  if (liveBtn) liveBtn.disabled = state.scrubIndex == null;
}

function setScrubIndex(index) {
  stopPlayback();
  state.scrubIndex = index;
  renderMap();
  updatePlaybackUI();
}

function goLive() {
  stopPlayback();
  state.scrubIndex = null;
  renderMap();
  updatePlaybackUI();
}

function togglePlayback() {
  if (playbackTimer != null) {
    stopPlayback();
    updatePlaybackUI();
    return;
  }
  if (state.trail.length < 2) return;
  if (state.scrubIndex == null || state.scrubIndex >= state.trail.length - 1) {
    state.scrubIndex = 0;
  }
  playbackTimer = setInterval(() => {
    state.scrubIndex = (state.scrubIndex ?? -1) + 1;
    if (state.scrubIndex >= state.trail.length - 1) {
      state.scrubIndex = state.trail.length - 1;
      stopPlayback();
    }
    renderMap();
    updatePlaybackUI();
  }, PLAYBACK_INTERVAL_MS);
  updatePlaybackUI();
}

function flyToTrack(id, opts) {
  const track = state.tracks.find((t) => t.id === id);
  if (!track || track.latitude == null || !leafletMap) return;
  const zoom = Math.max(leafletMap.getZoom(), 13);
  if (opts && opts.animate) {
    leafletMap.flyTo([track.latitude, track.longitude], zoom, { duration: 0.6 });
  } else {
    leafletMap.panTo([track.latitude, track.longitude], { animate: true, duration: 0.4 });
  }
}

async function acknowledge(id) {
  try {
    await fetchJSON(`/api/incidents/${id}/acknowledge`, { method: "POST" });
    await refresh();
  } catch (e) {
    if (e instanceof AuthError) showAuthBar(true);
    console.error(e);
  }
}

function renderClassFilters() {
  const el = document.getElementById("class-filters");
  el.innerHTML = CLASS_LABELS.map((c) => {
    const activeClass = state.classFilter === c ? "active" : "";
    const label = c === "all" ? "All" : c.charAt(0).toUpperCase() + c.slice(1);
    return `<span class="filter-chip ${activeClass}" data-class="${c}" style="margin-left:6px;">${label}</span>`;
  }).join("");
  el.querySelectorAll(".filter-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      state.classFilter = chip.dataset.class;
      renderClassFilters();
      renderTracks();
      renderMap();
    });
  });
}

function renderTracks() {
  const el = document.getElementById("tracks-table");
  const tracks = visibleTracks();
  document.getElementById("tracks-count").textContent = `${tracks.length}/${state.tracks.length}`;
  if (tracks.length === 0) {
    el.innerHTML = '<div class="empty">No tracks match.</div>';
    return;
  }
  const rows = tracks
    .slice()
    .sort((a, b) => (a.last_seen < b.last_seen ? 1 : -1))
    .map((t) => {
      const sel = t.id === state.selectedTrackId ? "selected" : "";
      const pos = t.latitude != null ? `${t.latitude.toFixed(4)}, ${t.longitude.toFixed(4)}` : "—";
      const title = [
        t.altitude_m != null ? `alt ${Math.round(t.altitude_m)}m` : null,
        t.speed_mps != null ? `${t.speed_mps.toFixed(1)} m/s` : null,
      ].filter(Boolean).join(" · ");
      return `<tr class="${sel}" data-id="${t.id}" title="${escapeHtml(title)}">
        <td>${t.id}</td>
        <td>${badge(t.classification, CLASS_COLOR[t.classification] || CLASS_COLOR.unknown)}</td>
        <td><span class="status-dot" style="background:${STATUS_COLOR[t.status] || STATUS_COLOR.closed}"></span> ${escapeHtml(t.status)}</td>
        <td>${pos}</td>
        <td>${fmtRelative(t.last_seen)}</td>
      </tr>`;
    })
    .join("");
  el.innerHTML = `<table>
    <thead><tr><th>ID</th><th>Class</th><th>Status</th><th>Position</th><th>Seen</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
  el.querySelectorAll("tbody tr").forEach((tr) => {
    tr.addEventListener("click", () => selectTrack(Number(tr.dataset.id)));
  });
}

function renderAlerts() {
  const el = document.getElementById("alerts-list");
  const active = state.incidents.filter((i) => i.status !== "resolved");
  document.getElementById("alerts-count").textContent = active.length ? String(active.length) : "";
  if (active.length === 0) {
    el.innerHTML = '<div class="empty-ok"><span class="check">&#10003;</span> No active alerts — all systems nominal.</div>';
    return;
  }
  const zoneName = (id) => state.zones.find((z) => z.id === id)?.name ?? `zone ${id}`;
  el.innerHTML = active
    .slice()
    .sort((a, b) => (a.opened_at < b.opened_at ? 1 : -1))
    .map((i) => `
      <div class="alert-item sev-${i.severity}">
        <div class="top-row">
          ${badge(i.severity, SEVERITY_COLOR[i.severity] || SEVERITY_COLOR.low)}
          ${badgeOutline(i.status, i.status === "open" ? "var(--drone)" : "var(--lost)")}
        </div>
        <div class="desc">${escapeHtml(i.description || i.incident_type)}${i.zone_id ? " · " + escapeHtml(zoneName(i.zone_id)) : ""}</div>
        <div style="color:var(--muted); font-size:12px;">track ${i.track_id ?? "—"} · opened ${fmtRelative(i.opened_at)}</div>
        ${i.status === "open" ? `<div style="margin-top:6px;"><button data-id="${i.id}">Acknowledge</button></div>` : ""}
      </div>
    `)
    .join("");
  el.querySelectorAll("button[data-id]").forEach((btn) => {
    btn.addEventListener("click", () => acknowledge(Number(btn.dataset.id)));
  });
}

// A small inline SVG sparkline of the selected track's trail -- lat/lon
// normalized into a fixed viewBox, not a geographically accurate map, just
// a quick "what shape has this flight taken" preview inside the details
// panel without needing a second full map widget.
function trailSparkline(trail) {
  if (trail.length < 2) return "";
  const lats = trail.map((p) => p.lat);
  const lons = trail.map((p) => p.lon);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const latRange = Math.max(maxLat - minLat, 1e-6);
  const lonRange = Math.max(maxLon - minLon, 1e-6);
  const w = 220, h = 60, pad = 6;
  const points = trail.map(({ lat, lon }) => {
    const x = pad + ((lon - minLon) / lonRange) * (w - 2 * pad);
    const y = h - pad - ((lat - minLat) / latRange) * (h - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const last = points[points.length - 1].split(",");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;">
    <polyline points="${points.join(" ")}" fill="none" stroke="#8b93a7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="#fff"/>
  </svg>`;
}

function renderDetails() {
  const el = document.getElementById("track-details");
  const track = state.tracks.find((t) => t.id === state.selectedTrackId);
  if (!track) {
    el.innerHTML = '<div class="empty">Click a track (or a map marker) to see details.</div>';
    return;
  }
  const related = state.incidents.filter((i) => i.track_id === track.id);
  const maneuverPct = track.maneuver_probability != null ? Math.round(track.maneuver_probability * 100) : null;
  const meterColor = maneuverPct == null ? "var(--border)" : maneuverPct < 33 ? "var(--active)" : maneuverPct < 66 ? "var(--medium)" : "var(--high)";

  el.innerHTML = `
    <div class="detail-header">
      <div class="title">
        ${badge(track.classification, CLASS_COLOR[track.classification])}
        <span>Track ${track.id}</span>
        <span class="status-dot" style="background:${STATUS_COLOR[track.status]}"></span>
        <span style="color:var(--muted); font-size:12px; font-weight:400;">${escapeHtml(track.status)}</span>
      </div>
      <div class="detail-actions">
        <button class="secondary" id="focus-btn">Focus</button>
        <button class="secondary ${state.follow ? "active" : ""}" id="follow-btn">${state.follow ? "Following" : "Follow"}</button>
      </div>
    </div>

    <div class="kv-section">
      <div class="kv-section-title">Identity</div>
      <div class="kv-cols">
        <div class="kv">
          <div class="k">UID</div><div class="v" title="${escapeHtml(track.track_uid)}">${escapeHtml(track.track_uid.slice(0, 13))}…</div>
          <div class="k">First seen</div><div class="v">${fmtRelative(track.first_seen)}</div>
        </div>
        <div class="kv">
          <div class="k">Last seen</div><div class="v">${fmtRelative(track.last_seen)}</div>
          <div class="k">Incidents</div><div class="v">${related.length}</div>
        </div>
      </div>
    </div>

    <div class="kv-section">
      <div class="kv-section-title">Position &amp; motion</div>
      <div class="kv-cols">
        <div class="kv">
          <div class="k">Position</div><div class="v">${track.latitude != null ? `${track.latitude.toFixed(5)}, ${track.longitude.toFixed(5)}` : "—"}</div>
          <div class="k">Altitude</div><div class="v">${track.altitude_m != null ? Math.round(track.altitude_m) + " m" : "—"}</div>
        </div>
        <div class="kv">
          <div class="k">Heading</div><div class="v">${track.heading_deg != null ? headingArrow(track.heading_deg) + " " + Math.round(track.heading_deg) + "°" : "—"}</div>
          <div class="k">Speed</div><div class="v">${track.speed_mps != null ? track.speed_mps.toFixed(1) + " m/s" : "—"}</div>
        </div>
      </div>
    </div>

    <div class="kv-section">
      <div class="kv-section-title">Track quality</div>
      <div class="kv">
        <div class="k">Uncertainty</div><div class="v">${track.position_uncertainty_m != null ? "±" + Math.round(track.position_uncertainty_m) + " m" : "—"}</div>
        <div class="k">Maneuvering</div>
        <div class="v">
          ${maneuverPct != null ? maneuverPct + "%" : "—"}
          <div class="meter"><div class="meter-fill" style="width:${maneuverPct ?? 0}%; background:${meterColor}"></div></div>
        </div>
      </div>
      <div class="sparkline-wrap">
        ${state.trail.length > 1 ? trailSparkline(state.trail) : `<div class="empty" style="padding:4px 0;">${state.trail.length ? "" : "loading trail…"}</div>`}
      </div>
    </div>

    ${state.trail.length > 1 ? `
    <div class="kv-section">
      <div class="kv-section-title">Playback</div>
      <div class="playback-row">
        <button class="secondary" id="play-btn">${playbackTimer != null ? "Pause" : "Play"}</button>
        <input type="range" id="scrub-range" min="0" max="${state.trail.length - 1}" step="1"
               value="${state.scrubIndex ?? state.trail.length - 1}">
        <span class="playback-time" id="scrub-time">${state.scrubIndex != null ? fmtTime(state.trail[state.scrubIndex].t) : "Live"}</span>
        <button class="secondary" id="live-btn" ${state.scrubIndex == null ? "disabled" : ""}>Live</button>
      </div>
    </div>` : ""}
  `;

  document.getElementById("focus-btn").addEventListener("click", () => flyToTrack(track.id, { animate: true }));
  document.getElementById("follow-btn").addEventListener("click", () => {
    state.follow = !state.follow;
    if (state.follow) flyToTrack(track.id, { animate: true });
    renderDetails();
  });
  const scrubRange = document.getElementById("scrub-range");
  if (scrubRange) scrubRange.addEventListener("input", (e) => setScrubIndex(Number(e.target.value)));
  const playBtn = document.getElementById("play-btn");
  if (playBtn) playBtn.addEventListener("click", togglePlayback);
  const liveBtn = document.getElementById("live-btn");
  if (liveBtn) liveBtn.addEventListener("click", goLive);
}

let leafletMap = null;
let zoneLayer = null;
let trackLayer = null;
let mapFitted = false;

function initMap() {
  // zoomControl:false + a manually-added bottom-right one, because the
  // default top-left position physically overlaps #map-layer-toggles
  // (also top-left) -- Leaflet's control sits on top and silently eats
  // clicks meant for the Trails/Vectors/Uncertainty checkboxes underneath
  // it. Bottom-right is the only corner not already used by another
  // control (top-right: layers; bottom-left: the legend).
  leafletMap = L.map("map", { zoomControl: false }).setView([51.5, -0.1], 11);
  L.control.zoom({ position: "bottomright" }).addTo(leafletMap);

  const osmAttr = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  const cartoAttr = osmAttr + ' &copy; <a href="https://carto.com/attributions">CARTO</a>';
  const esriAttr = "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS community";

  const darkLayer = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: cartoAttr, subdomains: "abcd", maxZoom: 19,
  });
  const roadLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: osmAttr, maxZoom: 19,
  });
  const satelliteLayer = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { attribution: esriAttr, maxZoom: 19 }
  );
  const satelliteLabels = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    { attribution: esriAttr, maxZoom: 19 }
  );

  darkLayer.addTo(leafletMap);
  L.control
    .layers(
      { Dark: darkLayer, Road: roadLayer, Satellite: satelliteLayer },
      { "Satellite labels": satelliteLabels },
      { position: "topright", collapsed: true }
    )
    .addTo(leafletMap);

  // The labels overlay only makes sense on top of Satellite -- drop it
  // automatically when switching to a different base layer, since Leaflet
  // doesn't couple overlays to a specific base layer on its own. Deferred
  // via setTimeout so it runs after the control's own click handling
  // finishes -- removing it synchronously happens while Leaflet's internal
  // _handlingClick guard is still set, which silently skips re-syncing the
  // control's checkbox even though the layer is actually removed.
  leafletMap.on("baselayerchange", (e) => {
    if (e.name !== "Satellite" && leafletMap.hasLayer(satelliteLabels)) {
      setTimeout(() => leafletMap.removeLayer(satelliteLabels), 0);
    }
  });

  zoneLayer = L.layerGroup().addTo(leafletMap);
  trackLayer = L.layerGroup().addTo(leafletMap);

  document.getElementById("toggle-trail").addEventListener("change", (e) => {
    state.showTrail = e.target.checked;
    renderMap();
  });
  document.getElementById("toggle-vectors").addEventListener("change", (e) => {
    state.showVectors = e.target.checked;
    renderMap();
  });
  document.getElementById("toggle-uncertainty").addEventListener("change", (e) => {
    state.showUncertainty = e.target.checked;
    renderMap();
  });
}

// A distinct shape per classification (not just color) so markers are
// tellable apart at a glance even for a viewer with red/green color
// vision deficiency, plus a heading arrow overlay for the selected track.
function markerIcon(track, selected) {
  const color = CLASS_COLOR_HEX[track.classification] || CLASS_COLOR_HEX.unknown;
  const size = selected ? 24 : 16;
  const half = size / 2;
  const stroke = selected ? '#fff' : 'rgba(255,255,255,0.35)';
  const strokeWidth = selected ? 2 : 1;
  let shape;
  if (track.classification === "aircraft") {
    shape = `<polygon points="${half},1 ${size - 1},${size - 1} ${half},${size - 5} 1,${size - 1}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}"/>`;
  } else if (track.classification === "bird") {
    shape = `<circle cx="${half}" cy="${half}" r="${half - 3}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}"/>`;
  } else {
    shape = `<circle cx="${half}" cy="${half}" r="${half - 2}" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}"/>`;
  }
  const rotation = track.heading_deg != null ? `transform:rotate(${track.heading_deg}deg);` : "";
  const html = `<div style="width:${size}px;height:${size}px;${rotation}">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${shape}</svg>
  </div>`;
  return L.divIcon({ html, className: "", iconSize: [size, size], iconAnchor: [half, half] });
}

function renderMap() {
  zoneLayer.clearLayers();
  trackLayer.clearLayers();

  state.zones.forEach((z) => {
    // Amber, deliberately distinct from any classification color -- a
    // zone outline reusing the drone-classification red made a restricted
    // zone visually indistinguishable from an actual drone marker/
    // uncertainty ring at a glance, especially once the map got bigger.
    L.polygon(z.polygon, {
      color: "#f59e0b",
      weight: 1.5,
      fillColor: "#f59e0b",
      fillOpacity: 0.08,
    })
      .bindPopup(escapeHtml(z.name))
      .addTo(zoneLayer);
  });

  if (state.showTrail && state.trail.length > 1) {
    L.polyline(state.trail.map((p) => [p.lat, p.lon]), { color: "#fff", weight: 2, opacity: 0.7, dashArray: "4 4" })
      .addTo(trackLayer);
  }

  const pts = visibleTracks().filter((t) => t.latitude != null && t.longitude != null);

  // Short fading breadcrumb trail per visible track, from recently polled
  // positions (breadcrumbs) -- unlike the selected track's full history
  // line above, this works for every track without a per-track history
  // fetch. Drawn as one short segment per pair of consecutive points, each
  // more opaque than the last, so the trail reads as "recent motion" with
  // a clear front/back rather than a static, directionless line.
  if (state.showTrail) {
    pts.forEach((t) => {
      const points = breadcrumbs.get(t.id);
      if (!points || points.length < 2) return;
      const color = CLASS_COLOR_HEX[t.classification] || CLASS_COLOR_HEX.unknown;
      for (let i = 1; i < points.length; i++) {
        const age = i / (points.length - 1); // 0 (oldest segment) -> 1 (newest)
        L.polyline(
          [[points[i - 1].lat, points[i - 1].lon], [points[i].lat, points[i].lon]],
          { color, weight: 2, opacity: 0.15 + age * 0.45 }
        ).addTo(trackLayer);
      }
    });
  }

  pts.forEach((t) => {
    const selected = t.id === state.selectedTrackId;
    const scrubbing = selected && state.scrubIndex != null;

    if (selected && state.showUncertainty && t.position_uncertainty_m) {
      L.circle([t.latitude, t.longitude], {
        radius: t.position_uncertainty_m,
        color: CLASS_COLOR_HEX[t.classification] || CLASS_COLOR_HEX.unknown,
        weight: 1,
        fillColor: CLASS_COLOR_HEX[t.classification] || CLASS_COLOR_HEX.unknown,
        fillOpacity: 0.08,
        dashArray: "3 4",
      }).addTo(trackLayer);
    }

    // A real great-circle projection of where this track will be in
    // VECTOR_HORIZON_S seconds if it holds its current heading/speed --
    // not just a color, an actual bearing a viewer can read off the map,
    // the same way RF direction-finding bearings are shown.
    if (state.showVectors && t.heading_deg != null && t.speed_mps != null && t.speed_mps >= MIN_VECTOR_SPEED_MPS) {
      const tip = destinationPoint(t.latitude, t.longitude, t.heading_deg, t.speed_mps * VECTOR_HORIZON_S);
      L.polyline([[t.latitude, t.longitude], tip], {
        color: CLASS_COLOR_HEX[t.classification] || CLASS_COLOR_HEX.unknown,
        weight: selected ? 2 : 1.5,
        opacity: 0.8,
        dashArray: "1 5",
        lineCap: "round",
      }).addTo(trackLayer);
    }

    const marker = L.marker([t.latitude, t.longitude], { icon: markerIcon(t, selected) })
      .on("click", () => selectTrack(t.id))
      .addTo(trackLayer);
    // Dim the live marker while scrubbing history for this track -- the
    // ghost marker below (at the scrubbed position) is the one that
    // should draw the eye.
    if (scrubbing) marker.setOpacity(0.35);

    const labelParts = [`#${t.id}`, t.classification];
    if (t.speed_mps != null) labelParts.push(`${t.speed_mps.toFixed(1)} m/s`);
    const label = labelParts.join(" · ");
    if (selected && !scrubbing) {
      marker.bindTooltip(label, { permanent: true, direction: "top", offset: [0, -14], className: "track-tooltip" });
    } else {
      // Non-permanent (hover-only) for an unselected track, and also for
      // the selected track's live marker while scrubbing its history --
      // dimmed context at that point, not the focal point, so a permanent
      // label would just compete with the ghost marker's below.
      marker.bindTooltip(label, { direction: "top", offset: [0, -10], className: "track-tooltip" });
    }
  });

  if (state.selectedTrackId != null && state.scrubIndex != null && state.trail[state.scrubIndex]) {
    const point = state.trail[state.scrubIndex];
    const selTrack = state.tracks.find((tr) => tr.id === state.selectedTrackId);
    const color = CLASS_COLOR_HEX[(selTrack && selTrack.classification) || "unknown"] || CLASS_COLOR_HEX.unknown;
    const ghostHtml = `<div style="width:20px;height:20px;">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <circle cx="10" cy="10" r="7" fill="${color}" fill-opacity="0.25" stroke="${color}" stroke-width="2" stroke-dasharray="3 2"/>
      </svg>
    </div>`;
    L.marker([point.lat, point.lon], {
      icon: L.divIcon({ html: ghostHtml, className: "", iconSize: [20, 20], iconAnchor: [10, 10] }),
      zIndexOffset: 500,
    })
      .bindTooltip(`history · ${fmtTime(point.t)}`, { permanent: true, direction: "top", offset: [0, -12], className: "track-tooltip" })
      .addTo(trackLayer);
  }

  if (state.follow && state.selectedTrackId != null) {
    flyToTrack(state.selectedTrackId, { animate: false });
  } else if (!mapFitted) {
    const allPts = [...pts.map((t) => [t.latitude, t.longitude]), ...state.zones.flatMap((z) => z.polygon)];
    if (allPts.length > 0) {
      leafletMap.fitBounds(allPts, { padding: [20, 20], maxZoom: 15 });
      mapFitted = true;
    }
  }
}

// Append each track's current position to its breadcrumb trail (skipping
// an unchanged position, so a stationary/hovering track doesn't pile up
// identical points instead of an actual trail), capped by both point count
// and age. Drops breadcrumbs for any track that no longer appears at all
// (closed/expired) so the map doesn't accumulate stale entries forever.
function recordBreadcrumbs(tracks) {
  const now = Date.now();
  const seen = new Set();
  tracks.forEach((t) => {
    if (t.latitude == null || t.longitude == null) return;
    seen.add(t.id);
    const points = breadcrumbs.get(t.id) || [];
    const last = points[points.length - 1];
    if (!last || last.lat !== t.latitude || last.lon !== t.longitude) {
      points.push({ lat: t.latitude, lon: t.longitude, t: now });
    }
    while (points.length > BREADCRUMB_MAX_POINTS) points.shift();
    while (points.length > 1 && now - points[0].t > BREADCRUMB_MAX_AGE_MS) points.shift();
    breadcrumbs.set(t.id, points);
  });
  for (const id of Array.from(breadcrumbs.keys())) {
    if (!seen.has(id)) breadcrumbs.delete(id);
  }
}

function renderSensors() {
  const el = document.getElementById("sensors-table");
  if (state.sensors.length === 0) {
    el.innerHTML = '<div class="empty">No sensor data yet.</div>';
    return;
  }
  const rows = state.sensors
    .map((s) => `<tr>
        <td>${escapeHtml(s.sensor_id)}</td>
        <td>${escapeHtml(s.sensor_type)}</td>
        <td><span class="status-dot" style="background:${SENSOR_STATUS_COLOR[s.status] || SENSOR_STATUS_COLOR.offline}"></span> ${escapeHtml(s.status)}</td>
        <td>${fmtRelative(s.last_seen)}</td>
      </tr>`)
    .join("");
  el.innerHTML = `<table>
    <thead><tr><th>Sensor ID</th><th>Type</th><th>Status</th><th>Seen</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function refresh() {
  try {
    const [tracks, incidents, zones, sensors] = await Promise.all([
      fetchJSON("/api/tracks"),
      fetchJSON("/api/incidents"),
      fetchJSON("/api/zones"),
      fetchJSON("/api/sensors"),
    ]);
    state.tracks = tracks;
    state.incidents = incidents;
    state.zones = zones;
    state.sensors = sensors;
    recordBreadcrumbs(tracks);
    showAuthBar(false);
    renderTracks();
    renderAlerts();
    renderMap();
    renderDetails();
    renderSensors();
    document.getElementById("status-line").textContent =
      `updated ${new Date().toLocaleTimeString()} · ${tracks.length} tracks · ${incidents.filter(i => i.status !== "resolved").length} active alerts`;
  } catch (e) {
    if (e instanceof AuthError) {
      showAuthBar(true);
      document.getElementById("status-line").textContent = "waiting for API key…";
    } else {
      document.getElementById("status-line").textContent = "connection error — retrying…";
    }
    console.error(e);
  }
}

document.getElementById("auth-save").addEventListener("click", () => {
  const input = document.getElementById("auth-input");
  apiKey = input.value.trim();
  localStorage.setItem("droneApiKey", apiKey);
  refresh();
});
document.getElementById("auth-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("auth-save").click();
});
document.getElementById("search-input").addEventListener("input", (e) => {
  state.search = e.target.value;
  renderTracks();
  renderMap();
});
// Number-key shortcuts to jump straight to a track by its position in the
// currently-visible (filtered) table, without needing to click first.
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const n = Number(e.key);
  if (n >= 1 && n <= 9) {
    const tracks = visibleTracks().slice().sort((a, b) => (a.last_seen < b.last_seen ? 1 : -1));
    if (tracks[n - 1]) selectTrack(tracks[n - 1].id);
  }
});

renderClassFilters();
initMap();
refresh();
setInterval(refresh, POLL_MS);
</script>
