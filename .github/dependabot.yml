version: 2
updates:
  # requirements.txt and every requirements-*.txt (postgres, dev, e2e,
  # migrations, and each optional hardware adapter's extras) all live in
  # the repo root -- Dependabot's pip ecosystem scans every
  # requirements*.txt file in the configured directory, so one entry here
  # covers all of them, not just requirements.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Patch/minor bumps across the whole dependency set land as one PR
      # instead of a dozen -- a major bump (more likely to need a code
      # change/review of its own, e.g. a FastAPI or SQLAlchemy major) still
      # gets its own PR.
      python-dependencies:
        update-types:
          - "minor"
          - "patch"

  # The Dockerfile's base image (python:3.12-slim) and Docker Compose's
  # postgres:16-alpine.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # actions/checkout, actions/setup-python, etc. in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
